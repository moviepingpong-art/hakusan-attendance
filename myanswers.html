<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>わたしの大会エントリー状況｜白山クラブ</title>

<!-- LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
  :root{
    /* ラージボールのオレンジ球にちなんだアクセント */
    --accent:#EE7733;
    --accent-dark:#C85B1B;
    --ink:#1F2328;          /* 本文 */
    --ink-soft:#5A6169;     /* 補足 */
    --line:#E4E6E9;         /* 区切り線 */
    --bg:#F6F5F2;           /* 背景 */
    --card:#FFFFFF;

    /* 回答の信号色 */
    --maru:#188038;   --maru-bg:#E6F4EA;   /* 〇 参加 */
    --san:#B26A00;    --san-bg:#FBF0DC;    /* △ どちらでも */
    --batsu:#5F6368;  --batsu-bg:#ECEDEF;  /* × 不参加 */
    --none:#C5221F;   --none-bg:#FCE8E6;   /* 未回答 */
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    font-size:18px;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }

  .wrap{max-width:560px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom));}

  /* ヘッダー */
  header{
    position:sticky;top:0;z-index:10;
    background:var(--bg);
    padding:16px 0 10px;
    border-bottom:1px solid var(--line);
  }
  .title{display:flex;align-items:center;gap:10px;}
  .ball{width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 34% 32%, #FFC38A, var(--accent) 62%, var(--accent-dark));
    flex:none;box-shadow:0 1px 2px rgba(0,0,0,.15);}
  .title h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.02em;}
  .who{margin:6px 0 0;color:var(--ink-soft);font-size:15px;}
  .who b{color:var(--ink);font-size:17px;}

  /* 凡例 */
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .legend span{
    font-size:13px;color:var(--ink-soft);
    background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:3px 10px;white-space:nowrap;
  }
  .legend b{font-weight:800;}
  .lg-o b{color:var(--maru);} .lg-s b{color:var(--san);}
  .lg-x b{color:var(--batsu);} .lg-n b{color:var(--none);}

  .bar{display:flex;justify-content:flex-end;margin:12px 0 4px;}
  .refresh{
    appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);
    font-size:14px;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:700;
  }
  .refresh:active{background:#f0f0f0;}

  /* 大会カード */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px 16px 14px;margin:14px 0;box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .card h2{font-size:19px;margin:0 0 8px;font-weight:800;line-height:1.4;}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink-soft);font-size:14.5px;margin-bottom:10px;}
  .meta .due-soon{color:var(--none);font-weight:800;}

  .status{
    display:inline-block;font-size:13.5px;font-weight:800;border-radius:999px;
    padding:4px 12px;margin-bottom:12px;
  }
  .st-done{color:var(--maru);background:var(--maru-bg);}
  .st-part{color:var(--san);background:var(--san-bg);}
  .st-none{color:var(--none);background:var(--none-bg);}

  /* 種目 行 */
  .rows{border-top:1px solid var(--line);}
  .row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);}
  .row .name{flex:1;font-size:16.5px;line-height:1.45;word-break:break-word;}
  .badge{
    flex:none;min-width:104px;text-align:center;
    font-size:16px;font-weight:800;border-radius:10px;padding:8px 8px;
  }
  .b-o{color:var(--maru);background:var(--maru-bg);}
  .b-s{color:var(--san);background:var(--san-bg);}
  .b-x{color:var(--batsu);background:var(--batsu-bg);}
  .b-n{color:var(--none);background:var(--none-bg);border:1px dashed var(--none);}

  .edit{
    display:block;width:100%;margin-top:14px;text-align:center;text-decoration:none;
    background:var(--accent);color:#fff;font-size:17px;font-weight:800;
    padding:14px;border-radius:12px;box-shadow:0 2px 0 var(--accent-dark);
  }
  .edit:active{transform:translateY(1px);box-shadow:0 1px 0 var(--accent-dark);}

  /* 状態表示（読み込み中・空・エラー） */
  .note{
    background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:24px 18px;text-align:center;color:var(--ink-soft);margin:16px 0;
  }
  .note.err{border-color:#F3B4AE;background:var(--none-bg);color:#8A1B15;}
  .note .big{font-size:18px;color:var(--ink);font-weight:800;margin-bottom:6px;}
  .note a{color:var(--accent-dark);font-weight:800;}
  .spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);
    border-top-color:var(--accent);margin:0 auto 12px;animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){ .spin{animation:none;} }

  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
</style>
</head>

<body>
<div class="wrap">
  <header>
    <div class="title"><span class="ball" aria-hidden="true"></span><h1>わたしの大会エントリー状況</h1></div>
    <p class="who" id="who"></p>
    <div class="legend">
      <span class="lg-o"><b>〇</b> 参加</span>
      <span class="lg-s"><b>△</b> どちらでも</span>
      <span class="lg-x"><b>×</b> 不参加</span>
      <span class="lg-n"><b>未回答</b> まだ答えていない</span>
    </div>
    <div class="bar"><button class="refresh" id="refreshBtn" type="button">最新に更新</button></div>
  </header>

  <main id="list">
    <div class="note"><div class="spin" aria-hidden="true"></div>読み込み中…</div>
  </main>
</div>

<script>
/* ===== 設定（ここだけ確認してください） ===== */

// ① 出欠フォームと同じ LIFF ID（変更不要）
const LIFF_ID = '2010475547-nDT2DLT8';

// ② 裏方GASのウェブアプリURL（末尾が /exec のもの）。
//    ※ index.html の中でfetchしている「同じURL」をそのまま貼ってください。
const API_URL = 'ここに index.html と同じ /exec のURLを貼る';

// ③ 「回答する・変更する」ボタンで開く出欠入力フォーム（同じLIFF）
const FORM_URL = 'https://liff.line.me/2010475547-nDT2DLT8';

/* ============================================= */

const $list = document.getElementById('list');
const $who  = document.getElementById('who');

document.getElementById('refreshBtn').addEventListener('click', () => load(true));

// フォームで回答して戻ってきたとき、自動で最新を取り直す
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && window.__ready) load(true);
});

let userId = null;

(async function init(){
  if (API_URL.indexOf('/exec') === -1) {
    showError('設定が未完了です。myanswers.html の API_URL に、出欠フォームと同じ /exec のURLを貼って保存してください。');
    return;
  }
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }   // LINEログインへ
    const prof = await liff.getProfile();
    userId = prof.userId;
    window.__ready = true;
    load(false);
  } catch (e) {
    showError('LINEの読み込みに失敗しました。LINEアプリのメニューから開き直してください。');
  }
})();

async function load(isReload){
  if (isReload) $list.innerHTML = '<div class="note"><div class="spin" aria-hidden="true"></div>更新中…</div>';
  try{
    const url = API_URL + '?action=myanswers&userId=' + encodeURIComponent(userId || '');
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'サーバーエラー');

    // 見出し（○○さんの…）
    const name = data.member && data.member.name ? data.member.name : '';
    $who.innerHTML = name
      ? '<b>' + esc(name) + '</b> さんの回答です'
      : 'はじめての方は、先に「出欠入力」で名前を登録してください';

    render(data.myanswers || []);
  }catch(e){
    showError('データの取得に失敗しました。電波の良い場所で「最新に更新」を押してください。');
  }
}

function render(items){
  if (!items.length){
    $list.innerHTML = '<div class="note"><div class="big">いま締切前の大会はありません</div>'
      + '新しい大会が登録されると、ここに表示されます。</div>';
    return;
  }
  $list.innerHTML = items.map(cardHtml).join('');
}

function cardHtml(t){
  // ステータス（全種目回答済み / 一部 / 未回答）
  let stCls = 'st-none', stTxt = '未回答';
  if (t.allAnswered)      { stCls = 'st-done'; stTxt = '回答済み'; }
  else if (t.answered)    { stCls = 'st-part'; stTxt = '一部だけ回答'; }

  const rows = (t.shumoku || []).map(s => {
    const b = badge(s.answer);
    return '<div class="row"><div class="name">' + esc(s.name) + '</div>'
         + '<div class="badge ' + b.cls + '">' + b.txt + '</div></div>';
  }).join('');

  const due = dueMeta(t.shimekiri);

  return '<article class="card">'
    + '<h2>' + esc(t.taikaimei) + '</h2>'
    + '<div class="meta">'
    +   (t.kaisaibi ? '<span>開催 ' + esc(t.kaisaibi) + '</span>' : '')
    +   (t.shimekiri ? '<span class="' + due.cls + '">締切 ' + esc(t.shimekiri) + due.suffix + '</span>' : '')
    + '</div>'
    + '<span class="status ' + stCls + '">' + stTxt + '</span>'
    + '<div class="rows">' + rows + '</div>'
    + '<a class="edit" href="' + FORM_URL + '">回答する・変更する</a>'
    + '</article>';
}

function badge(a){
  if (a === '〇') return { cls:'b-o', txt:'〇 参加' };
  if (a === '△') return { cls:'b-s', txt:'△ どちらでも' };
  if (a === '×') return { cls:'b-x', txt:'× 不参加' };
  return { cls:'b-n', txt:'未回答' };
}

// 締切が近い（3日以内）なら赤字＋「あとN日」を付ける
function dueMeta(ymd){
  const m = String(ymd||'').match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  if (!m) return { cls:'', suffix:'' };
  const due = new Date(Number(m[1]), Number(m[2])-1, Number(m[3])); due.setHours(23,59,59,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.floor((due - today) / 86400000);
  if (days >= 0 && days <= 3) return { cls:'due-soon', suffix:'（あと' + days + '日）' };
  return { cls:'', suffix:'' };
}

function showError(msg){
  $list.innerHTML = '<div class="note err"><div class="big">読み込めませんでした</div>'
    + esc(msg) + '</div>';
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
</script>
</body>
</html>
