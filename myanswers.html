<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>わたしの大会エントリー状況｜白山ラージボール卓球クラブ</title>

<!-- LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
  :root{
    /* index.html と同じクラブカラー（山と空：青系＋差し色の赤） */
    --bg:#eef3f7; --card:#ffffff; --ink:#1d2733; --sub:#5a6b7b;
    --line:#d6e0ea; --brand:#1769b0; --brand-d:#0f4f88;
    --maru:#1a8f4c;   --maru-bg:#e3f4ea;    /* 〇 参加 */
    --batsu:#c0392b;  --batsu-bg:#fbe7e4;   /* × 不参加・未回答 */
    --sankaku:#b8860b;--sankaku-bg:#fbf3df; /* △ どちらでも */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    font-size:17px; line-height:1.6; padding:0 0 calc(48px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }

  header{
    background:var(--brand); color:#fff; padding:18px 18px 16px;
    position:sticky; top:0; z-index:5;
  }
  header h1{margin:0; font-size:19px; font-weight:700;}
  header p{margin:4px 0 0; font-size:13px; opacity:.9;}

  .me{
    margin:10px 18px 0; font-size:14px; color:var(--sub);
    display:flex; align-items:center; gap:8px; min-height:1.2em;
  }
  .me b{color:var(--ink);}

  /* 凡例 */
  .legend{display:flex; flex-wrap:wrap; gap:7px; margin:12px 14px 0;}
  .legend span{
    font-size:12.5px; color:var(--sub); background:#fff;
    border:1px solid var(--line); border-radius:999px; padding:3px 10px; white-space:nowrap;
  }
  .legend b{font-weight:700;}
  .lg-o b{color:var(--maru);} .lg-s b{color:var(--sankaku);}
  .lg-x b{color:var(--batsu);} .lg-n b{color:var(--batsu);}

  .bar{display:flex; justify-content:flex-end; margin:12px 14px 0;}
  .refresh{
    appearance:none; border:1px solid var(--line); background:#fff; color:var(--brand-d);
    font-size:14px; padding:8px 14px; border-radius:9px; cursor:pointer; font-weight:700;
  }
  .refresh:active{background:#e8f1f9;}

  .wrap{padding:14px;}

  /* 大会カード（index.html のカードに合わせる） */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    margin:0 0 18px; overflow:hidden; box-shadow:0 1px 3px rgba(20,50,80,.06);
  }
  .card-head{padding:16px 16px 12px; border-bottom:1px solid var(--line);}
  .card-head.no-border{border-bottom:none;}
  .card-head h2{margin:0 0 6px; font-size:18px; line-height:1.4;}
  .meta{font-size:14px; color:var(--sub); margin:2px 0;}
  .meta.deadline{color:var(--batsu); font-weight:700;}

  .status{
    display:inline-block; font-size:13px; font-weight:700; border-radius:999px;
    padding:4px 12px; margin-top:8px;
  }
  .st-done{color:var(--maru);    background:var(--maru-bg);}
  .st-part{color:var(--sankaku); background:var(--sankaku-bg);}

  /* 未回答の大会：大きく「未回答」だけ */
  .unanswered{
    margin:16px; padding:22px 16px; text-align:center;
    background:var(--batsu-bg); border:2px dashed var(--batsu); border-radius:14px;
  }
  .unanswered .word{font-size:30px; font-weight:800; color:var(--batsu); letter-spacing:.08em;}
  .unanswered .sub{font-size:14px; color:#8a241a; margin-top:6px;}

  /* 種目 行（回答済みの大会） */
  .row{display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid #eef2f6;}
  .row:last-of-type{border-bottom:none;}
  .row .name{flex:1; font-size:16.5px; font-weight:700; line-height:1.45; word-break:break-word;}
  .badge{
    flex:none; min-width:112px; text-align:center;
    font-size:16px; font-weight:700; border-radius:10px; padding:9px 8px;
  }
  .b-o{color:var(--maru);    background:var(--maru-bg);}
  .b-s{color:var(--sankaku); background:var(--sankaku-bg);}
  .b-x{color:var(--batsu);   background:var(--batsu-bg);}
  .b-n{color:var(--batsu);   background:var(--batsu-bg); border:1px dashed var(--batsu);}

  .edit{
    display:block; margin:14px 16px 16px; text-align:center; text-decoration:none;
    background:var(--brand); color:#fff; font-size:17px; font-weight:700;
    padding:15px; border-radius:12px;
  }
  .edit:active{background:var(--brand-d);}

  /* 状態表示 */
  .note{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:40px 20px; text-align:center; color:var(--sub); margin:14px;
  }
  .note.err{border-color:#f0b9b2; background:var(--batsu-bg); color:#8a241a;}
  .note .big{font-size:18px; color:var(--ink); font-weight:700; margin-bottom:6px;}
  .spinner{
    width:34px;height:34px;margin:0 auto 14px;border:4px solid var(--line);
    border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none;}}

  :focus-visible{outline:3px solid var(--brand); outline-offset:2px;}
</style>
</head>
<body>

<header>
  <h1>わたしの大会エントリー状況</h1>
  <p>白山ラージボール卓球クラブ</p>
</header>
<div class="me" id="me"></div>

<div class="legend">
  <span class="lg-o"><b>〇</b> 参加</span>
  <span class="lg-s"><b>△</b> どちらでも</span>
  <span class="lg-x"><b>×</b> 不参加</span>
  <span class="lg-n"><b>未回答</b> まだ答えていない</span>
</div>
<div class="bar"><button class="refresh" id="refreshBtn" type="button">最新に更新</button></div>

<div class="wrap" id="list">
  <div class="note"><div class="spinner" aria-hidden="true"></div>読み込んでいます…</div>
</div>

<script>
/* ===== 設定（変更不要） ===== */
const LIFF_ID  = "2010475547-YIPFjUme";  // このページ専用のLIFF「わたしの回答」
const API_URL  = "https://script.google.com/macros/s/AKfycbwmS3DUX7BBmT2Vh7U3OkNWdD4Z5IWgLHOMIuqmkSfvMDrk7UBZNewfLsHCzFvq6-hv/exec";
const FORM_URL = "https://liff.line.me/2010475547-nDT2DLT8";  // 「変更する」で開く出欠入力フォーム
/* ============================ */

const $list = document.getElementById("list");
const $me   = document.getElementById("me");
let userId  = null;

document.getElementById("refreshBtn").addEventListener("click", ()=> load(true));

// フォームで回答して戻ってきたら自動で最新化
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && window.__ready) load(true);
});

(async function init(){
  try{
    await liff.init({liffId: LIFF_ID});
    // 勝手にフォームへ飛ばさない：未ログインならその場に案内を出すだけ
    if(!liff.isLoggedIn()){
      showError("このページはLINEアプリから開いてください。");
      return;
    }
    const prof = await liff.getProfile();
    userId = prof.userId;
    window.__ready = true;
    load(false);
  }catch(e){
    showError("LINEの読み込みに失敗しました。LINEアプリのメニューから開き直してください。");
  }
})();

async function load(isReload){
  if(isReload) $list.innerHTML = '<div class="note"><div class="spinner" aria-hidden="true"></div>更新中…</div>';
  try{
    const url = API_URL + "?action=myanswers&userId=" + encodeURIComponent(userId || "");
    const res = await fetch(url);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "サーバーエラー");

    const name = data.member && data.member.name ? data.member.name : "";
    $me.innerHTML = name
      ? '<span><b>' + esc(name) + '</b> さんの回答です</span>'
      : '<span>はじめての方は、先に「出欠入力」で名前を登録してください</span>';

    render(data.myanswers || []);
  }catch(e){
    showError("データの取得に失敗しました。電波の良い場所で「最新に更新」を押してください。");
  }
}

function render(items){
  if(!items.length){
    $list.innerHTML = '<div class="note"><div class="big">いま締切前の大会はありません</div>'
      + '新しい大会が登録されると、ここに表示されます。</div>';
    return;
  }
  $list.innerHTML = items.map(cardHtml).join("");
}

function cardHtml(t){
  const due = dueMeta(t.shimekiri);
  const head =
      '<div class="card-head' + (t.answered ? '' : ' no-border') + '">'
    +   '<h2>' + esc(t.taikaimei) + '</h2>'
    +   (t.kaisaibi  ? '<div class="meta">📅 開催：' + esc(t.kaisaibi) + '</div>' : "")
    +   (t.shimekiri ? '<div class="meta deadline">⏰ 締切：' + esc(t.shimekiri) + due.suffix + '</div>' : "")
    +   (t.answered ? statusPill(t) : "")
    + '</div>';

  // ── 未回答の大会：大きく「未回答」と表示するだけ（フォームへの導線なし）──
  if(!t.answered){
    return '<div class="card">' + head
      + '<div class="unanswered">'
      +   '<div class="word">未回答</div>'
      +   '<div class="sub">この大会にはまだ回答していません</div>'
      + '</div>'
      + '</div>';
  }

  // ── 回答済み／一部回答の大会：種目ごとの回答＋「変更する」ボタン ──
  const rows = (t.shumoku || []).map(s=>{
    const b = badge(s.answer);
    return '<div class="row"><div class="name">' + esc(s.name) + '</div>'
         + '<div class="badge ' + b.cls + '">' + b.txt + '</div></div>';
  }).join("");

  return '<div class="card">' + head + rows
    + '<a class="edit" href="' + FORM_URL + '">回答を変更する</a>'
    + '</div>';
}

function statusPill(t){
  if(t.allAnswered) return '<div><span class="status st-done">回答済み</span></div>';
  return '<div><span class="status st-part">一部だけ回答</span></div>';
}

function badge(a){
  if(a === "〇") return {cls:"b-o", txt:"〇 参加"};
  if(a === "△") return {cls:"b-s", txt:"△ どちらでも"};
  if(a === "×") return {cls:"b-x", txt:"× 不参加"};
  return {cls:"b-n", txt:"未回答"};
}

// 締切が3日以内なら「（あとN日）」を付ける
function dueMeta(ymd){
  const m = String(ymd||"").match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  if(!m) return {suffix:""};
  const due = new Date(Number(m[1]), Number(m[2])-1, Number(m[3])); due.setHours(23,59,59,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.floor((due - today)/86400000);
  if(days >= 0 && days <= 3) return {suffix:"（あと" + days + "日）"};
  return {suffix:""};
}

function showError(msg){
  $list.innerHTML = '<div class="note err"><div class="big">読み込めませんでした</div>' + esc(msg) + '</div>';
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, m=>(
    {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]
  ));
}
</script>
</body>
</html>
