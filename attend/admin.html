<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title data-i18n-title="adTitle">出欠システムの管理</title>
<link rel="stylesheet" href="attend.css?v=20260829">
<style>
  /* 管理画面だけの見た目。共通CSSに足すと参加者ページまで太るのでここに置く */
  .tkcard{border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:0 0 10px; background:#fff;}
  .tkcard .n{font-weight:700; font-size:16px; line-height:1.4;}
  .tkcard .m{font-size:13.5px; color:var(--sub); margin:4px 0 0;}
  /* ドロッパーから届いた行事。ふつうの行事カードと見分けがつくようにする */
  .tkcard.in{border-color:var(--maru); background:var(--maru-bg);}
  /* ドロッパーから開いたタブにだけ出す帰り道。押した先で作業が続くので、上に置く */
  .backbar{max-width:720px; margin:12px auto 0; padding:0 14px;}
  .backbar .btn{width:auto; padding:9px 16px; font-size:15px;}
  .conn{border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:0 0 14px;}
  .conn .hint{margin:0 0 10px;}
  .b{display:inline-block; font-size:12px; font-weight:700; border-radius:999px; padding:3px 10px; margin:8px 0 0;}
  .b.no{background:#eef3f7; color:var(--sub);}
  .b.yes{background:var(--maru-bg); color:var(--maru);}
  .mrow{display:flex; gap:8px; align-items:center; margin:0 0 8px;}
  .mrow input{flex:1; min-width:0; padding:11px; font-size:16px; border:2px solid var(--line);
              border-radius:10px; font-family:inherit;}
  .mrow select{flex:none; padding:11px 6px; font-size:15px; border:2px solid var(--line);
               border-radius:10px; background:#fff; font-family:inherit;}
  .mrow .del{flex:none; width:40px; padding:10px 0; border:none; background:#eef3f7;
             border-radius:10px; color:var(--sub); font-size:16px; cursor:pointer;}
  textarea{width:100%; min-height:96px; padding:12px; font-size:14px; border:2px solid var(--line);
           border-radius:10px; font-family:inherit; resize:vertical;}
  .pend{font-size:13.5px; color:var(--sub); margin:8px 0 0; word-break:break-word;}
  .danger{border-color:var(--batsu);}
  .danger h2{color:var(--batsu);}
  .btn.warn{background:var(--batsu);}
  /* 消すボタンは、押し間違えないよう他と色を分ける */
  .btn.sub.del-ev, [data-tkdel]{color:var(--batsu); border-color:var(--batsu);}
  /* 言語の選択。名簿の行のセレクトとは幅の考え方が違うので、別に持つ */
  /* box-sizing を書かないと、padding と枠のぶんだけ画面からはみ出す（実際に出た） */
  /* ★ .field select と書かないこと。名簿の行（.mrow）も .field の中にあるので、
     男女のセレクトまで幅いっぱいに広がって行が画面からはみ出す（実際に出た）。 */
  .field > select{width:100%; box-sizing:border-box; padding:11px; font-size:16px;
                border:2px solid var(--line); border-radius:10px; background:#fff; font-family:inherit;}
  .uilang{max-width:720px; margin:10px auto 0; padding:0 14px; display:flex; gap:8px;
          align-items:center; justify-content:flex-end; font-size:13px; color:var(--sub);}
  .uilang select{padding:6px 8px; font-size:14px; border:1px solid var(--line);
                 border-radius:8px; background:#fff; font-family:inherit;}
  [hidden]{display:none !important;}
</style>
</head>
<body>

<header>
  <h1 data-i18n="adTitle">出欠システムの管理</h1>
  <p id="org"></p>
</header>

<!-- 画面のことば。**参加者に見せることばとは別物**（日本語の主催者が英語の団体を持つことがある） -->
<p class="uilang">
  <label for="uiLang" data-i18n="adUiLang">画面のことば</label>
  <select id="uiLang">
    <option value="ja">日本語</option>
    <option value="en">English</option>
    <option value="in">Hinglish</option>
  </select>
</p>

<!-- ドロッパーから開いたときだけ出る。閉じれば、もとのタブがそのまま残っている -->
<p class="backbar" id="backBar" hidden>
  <button class="btn sub" id="backGo" type="button" data-i18n="adBack">← イベントドロッパーに戻る</button>
  <span class="hint" id="backMsg"></span>
</p>

<div class="wiz">

  <!-- 合鍵つきのリンクで来ていないとき。まず「すでにお持ちの方」を見せる。
       ここを飛ばして下でつくられると、団体が二重になって配ったURLが古いほうを指したままになる -->
  <section class="step" id="haveScreen" hidden>
    <h2 data-i18n="adHaveTitle">すでに団体をお持ちの方</h2>
    <p class="hint" data-i18n="adHaveLead"></p>
    <div class="field">
      <label for="haveKey" data-i18n="adHaveLabel">管理リンク</label>
      <input id="haveKey" type="text" inputmode="url" autocomplete="off"
             placeholder="https://app.dropper-tools.com/attend/admin.html?s=…#k=…">
    </div>
    <p class="msg" id="haveMsg"></p>
    <button class="btn wide" id="haveGo" type="button" data-i18n="adHaveGo">この管理リンクで開く</button>
  </section>

  <section class="step" id="newScreen" hidden>
    <h2><span class="num">1</span><span data-i18n="adNewTitle">団体をつくる</span></h2>
    <p class="hint" data-i18n="adNewWarn"></p>

    <div class="field">
      <label for="newOrg" data-i18n="adOrgName">団体名</label>
      <input id="newOrg" type="text" data-i18n-ph="adOrgNamePh" placeholder="例：白山ラージボール卓球クラブ" autocomplete="off">
    </div>

    <div class="field">
      <label for="newLang" data-i18n="adOrgLang">参加者に見せることば</label>
      <select id="newLang">
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="in">Hinglish</option>
      </select>
      <p class="hint" data-i18n="adOrgLangHint"></p>
    </div>

    <div class="field">
      <label data-i18n="adMembers">メンバー</label>
      <div id="newRows"></div>
      <button class="btn sub" id="newAdd" type="button" data-i18n="adAddOne">＋ 1人ふやす</button>
    </div>

    <p class="msg" id="newMsg"></p>
    <button class="btn wide" id="newGo" type="button" data-i18n="adCreate">この内容でつくる</button>
  </section>

  <!-- つくった直後。合鍵を見せるのはここ1回だけ -->
  <section class="step done" id="keyScreen" hidden>
    <h2 data-i18n="adDoneTitle">できあがりました</h2>
    <div class="warn" id="keyWarn"></div>
    <div class="urlbox">
      <div class="t" data-i18n="adKeyBoxT">管理リンク（あなただけのもの。人に渡さないでください）</div>
      <div class="u"><input id="keyUrl" type="text" readonly><button class="btn" data-copy="keyUrl" type="button" data-i18n="adCopy">コピー</button></div>
    </div>
    <button class="btn wide" id="keyGo" type="button" style="margin-top:16px;" data-i18n="adKeyGo">保存しました。管理画面へ</button>
  </section>

  <!-- ふだん使う画面 -->
  <div id="home" hidden>

    <!-- 行事 -->
    <section class="step">
      <h2 data-i18n="adTkTitle">行事から出欠を作る</h2>

      <!-- ドロッパーから届いた行事。#t= で開いたときだけ出る -->
      <div class="tkcard in" id="tkIn" hidden>
        <div class="n" id="tkInName" data-i18n="adTkFrom">イベントドロッパーから届きました</div>
        <div class="m" id="tkInMeta"></div>
        <p class="msg" id="tkInMsg"></p>
        <button class="btn wide" id="tkInGo" type="button" hidden data-i18n="adTkAccept">この内容で出欠を受け付ける</button>
        <button class="btn sub wide" id="tkInLater" type="button" style="margin-top:8px;" data-i18n="adTkClose">とじる</button>
      </div>

      <!-- ドロッパーとつなぐ（合鍵をこの端末に覚えるかどうか） -->
      <div class="conn">
        <p class="hint" id="connNote"></p>
        <button class="btn sub" id="connGo" type="button">この端末に覚える</button>
      </div>

      <p data-i18n="adTkLead"></p>
      <p class="msg" id="tkMsg"></p>

      <!-- 貼り付けは、タブが開かなかったときの逃げ道。ふだんは畳んでおく -->
      <button class="btn sub wide" id="tkPasteBtn" type="button">この画面が開かなかったときは</button>
      <div id="tkPaste" hidden style="margin-top:12px;">
        <p class="hint" data-i18n="adPasteLead"></p>
        <textarea id="tkToken" data-i18n-ph="adPastePh" placeholder="ここに貼り付け" autocomplete="off"></textarea>
        <button class="btn wide" id="tkImport" type="button" data-i18n="adPasteGo">貼り付けて取り込む</button>
      </div>

      <div id="tkList" style="margin-top:16px;"></div>
      <p class="hint" id="tkMore" hidden></p>

      <button class="btn sub wide" id="tkManualBtn" type="button" style="margin-top:8px;">＋ 手で入力して追加</button>
      <div id="tkManual" hidden style="margin-top:12px;">
        <div class="field"><label for="mkName" data-i18n="adMkName">行事名</label><input id="mkName" type="text" autocomplete="off"></div>
        <div class="field"><label for="mkDate" data-i18n="adMkDate">開催日</label><input id="mkDate" type="date"></div>
        <div class="field"><label for="mkDead" data-i18n="adMkDead">申込締切</label><input id="mkDead" type="date"></div>
        <div class="field"><label for="mkPlace" data-i18n="adMkPlace">会場（回答画面の地図ボタンに使います）</label><input id="mkPlace" type="text" autocomplete="off"></div>
        <div class="field"><label for="mkItems" data-i18n="adMkItems">種目（読点で区切る。空なら「参加」）</label><input id="mkItems" type="text" autocomplete="off"></div>
        <p class="msg" id="mkMsg"></p>
        <button class="btn wide" id="mkGo" type="button" data-i18n="adMkGo">この行事を追加</button>
      </div>
    </section>

    <!-- 受付中の出欠 -->
    <section class="step">
      <h2 data-i18n="adEvTitle">出欠の集まり具合</h2>
      <p class="hint" data-i18n="adEvHint"></p>
      <div id="evList"></div>
    </section>

    <!-- 自分用の管理リンク。ふだんは伏せておく（肩ごしに見られる場所で開くこともある） -->
    <section class="step">
      <h2 data-i18n="adMyTitle">あなたの管理リンク</h2>
      <p class="hint" id="myHint"></p>
      <button class="btn sub wide" id="myShow" type="button">管理リンクを表示する</button>
      <div id="myBox" hidden style="margin-top:12px;">
        <div class="urlbox">
          <div class="t" data-i18n="adMyBoxT">あなただけのもの</div>
          <div class="u"><input id="myUrl" type="text" readonly><button class="btn" data-copy="myUrl" type="button" data-i18n="adCopy">コピー</button></div>
        </div>
        <p class="hint" data-i18n="adMyNote"></p>
      </div>
    </section>

    <!-- 配るURL -->
    <section class="step">
      <h2 data-i18n="adUrlTitle">みなさんに配るURL</h2>
      <!-- 2026-08-25：3本 → 1本。この1本にタブが付いていて、出欠入力・わたしの回答・
           出欠確認のすべてに行ける。my.html / status.html は転送ページとして残してある -->
      <div class="urlbox">
        <div class="t" data-i18n="adUrl1">出欠のページ</div>
        <div class="u"><input id="u1" type="text" readonly><button class="btn" data-copy="u1" type="button" data-i18n="adCopy">コピー</button></div>
      </div>
      <p class="hint" data-i18n="adUrlHint"></p>
    </section>

    <!-- 団体名と名簿 -->
    <section class="step">
      <h2 data-i18n="adEditTitle">団体名とメンバー</h2>
      <div class="field">
        <label for="edOrg" data-i18n="adOrgName">団体名</label>
        <input id="edOrg" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="edLang" data-i18n="adOrgLang">参加者に見せることば</label>
        <select id="edLang">
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="in">Hinglish</option>
        </select>
      </div>
      <div class="field">
        <label data-i18n="adMembersEdit">メンバー（備考に「退会」と書くと名簿から外れます）</label>
        <div id="edRows"></div>
        <button class="btn sub" id="edAdd" type="button" data-i18n="adAddOne">＋ 1人ふやす</button>
      </div>
      <p class="msg" id="edMsg"></p>
      <button class="btn wide" id="edSave" type="button" data-i18n="adSave">保存する</button>
    </section>

    <!-- 削除 -->
    <section class="step danger">
      <h2 data-i18n="adDelTitle">この団体を削除する</h2>
      <p id="delLead"></p>
      <div class="field">
        <label for="delName" data-i18n="adDelLabel">確認のため、団体名をそのまま入力してください</label>
        <input id="delName" type="text" autocomplete="off">
      </div>
      <p class="msg" id="delMsg"></p>
      <button class="btn warn wide" id="delGo" type="button" data-i18n="adDelGo">削除する</button>
    </section>

  </div>
</div>

<script src="attend.js?v=20260829"></script>
<script src="admin-i18n.js?v=20260829"></script>
<script>
(function () {
  'use strict';

  var esc = ATTEND.esc;
  var T = ATTEND.t;
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 画面のことば ----------
     ★ 参加者に見せることば（団体の設定）とは**別物**。
     日本語の主催者が英語の団体を運営することがあるので、団体の設定には従わない。
     既定はブラウザのことば。選んだら端末に覚える。 */
  var UI_LANG_KEY = 'attend.adminLang';
  ATTEND.followOrgLang(false);

  (function () {
    var saved = ATTEND.lsGet(UI_LANG_KEY);
    var use = ATTEND.setUiLang(saved || ATTEND.browserLang());
    var sel = document.getElementById('uiLang');
    sel.value = use;
    sel.addEventListener('change', function () {
      ATTEND.lsSet(UI_LANG_KEY, ATTEND.setUiLang(sel.value));
      repaint();
    });
    repaint();   // 起動時にも通す。**忘れると、組み立てで作る文言が空のままになる**
  })();

  /** ことばを変えたときに、その場で作り直す部分 */
  function repaint() {
    $('keyWarn').innerHTML = '<b>' + esc(T('adKeyWarn1')) + '</b><br>'
      + esc(T('adKeyWarn2')) + '<b>' + esc(T('adKeyWarn3')) + '</b><br>' + esc(T('adKeyWarn4'));
    $('myHint').innerHTML = T('adMyHint');
    $('delLead').innerHTML = T('adDelLead');
    $('myShow').textContent = T($('myBox').hidden ? 'adMyShow' : 'adMyHide');
    $('tkPasteBtn').textContent = T($('tkPaste').hidden ? 'adPasteOpen' : 'adPasteClose');
    $('tkManualBtn').textContent = T($('tkManual').hidden ? 'adManualOpen' : 'adManualClose');
    if (!$('home').hidden) { paintConn(); loadTaikai(); loadEvents(); }
  }
  var show = function (el, on) { el.hidden = !on; };
  var say = function (el, text, cls) { el.textContent = text; el.className = 'msg' + (cls ? ' ' + cls : ''); };

  /* ---------- 端末の記憶 ----------
     localStorage は、ブロックされていると例外を投げずに黙って捨てる実装がある。
     書いたら読み直して確かめること。 */
  var REM = 'dropperAdminKey';   // この端末に覚えた合鍵
  var PEND = 'dropperPending';   // 合鍵が無いときの、取り込み待ちの置き場
  var PEND_MS = 60 * 60 * 1000;  // 1時間で捨てる。放置された行事が忘れたころに湧かないように

  function pick(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function store(k, v) {
    try {
      if (v == null) { localStorage.removeItem(k); return !localStorage.getItem(k); }
      localStorage.setItem(k, v);
      return localStorage.getItem(k) === v;
    } catch (e) { return false; }
  }

  /* ---------- 合鍵 ----------
     合鍵は # のうしろに置く。# はサーバーに送られないので、アクセスログにも
     Referer にも残らない。?k= で来た人は # に移し替えてから読む。
     #t= はドロッパーから届いた行事。合鍵とは別物で、こちらは使い捨て。 */
  var adminKey = '';
  var keyFromUrl = false;
  var inToken = '';
  (function readHash() {
    var h = (location.hash || '').replace(/^#/, '');
    var mk = h.match(/(?:^|&)k=([^&]+)/);
    if (mk) { adminKey = decodeURIComponent(mk[1]); keyFromUrl = true; }
    var mt = h.match(/(?:^|&)t=([^&]+)/);
    if (mt) inToken = decodeURIComponent(mt[1]);

    var q = new URLSearchParams(location.search);
    if (!adminKey && q.get('k')) {
      adminKey = q.get('k');
      keyFromUrl = true;
      q.delete('k');
      var url = location.pathname + (q.toString() ? '?' + q : '') + '#k=' + encodeURIComponent(adminKey);
      try { history.replaceState(null, '', url); } catch (e) { /* 古い端末では諦める */ }
    }

    // 覚えてあるなら、リンクなしで開いても使える
    if (!adminKey) adminKey = pick(REM);

    /* #t= はアドレス欄から消す。読み直しで二度取り込まないためと、
       ドロッパーから開いたタブに合鍵を映さないため（記憶から来た合鍵は # に書き戻さない）。 */
    if (inToken) {
      var q2 = new URLSearchParams(location.search);
      var back = location.pathname + (q2.toString() ? '?' + q2 : '')
        + (keyFromUrl ? '#k=' + encodeURIComponent(adminKey) : '');
      try { history.replaceState(null, '', back); } catch (e) { /* noop */ }
    }
  })();

  /* 合鍵が無いまま届いた行事は、しばらく預かる。
     主催者が管理リンクを開き直したときに、貼り付けずに済むように。 */
  function keepPending(token) { store(PEND, JSON.stringify({ t: token, at: Date.now() })); }
  function takePending() {
    var raw = pick(PEND);
    if (!raw) return '';
    store(PEND, null);
    try {
      var o = JSON.parse(raw);
      if (o && o.t && Date.now() - (o.at || 0) < PEND_MS) return o.t;
    } catch (e) { /* 壊れていたら捨てるだけ */ }
    return '';
  }

  /* ---------- 通信 ----------
     ATTEND.post は ?s= を前提にしているが、団体を作る前は ?s= が無い。
     ここでは行き先を直に指すほうが素直なので、そうしている。 */
  function api(body) {
    return fetch(ATTEND.API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.text(); }).then(function (t) {
      var d;
      try { d = JSON.parse(t); } catch (e) { throw new Error(T('adErrConn')); }
      // 訳すのは ATTEND.errOf の1か所だけ。needKey などの目印もそこで付く
      if (!d || d.ok !== true) throw ATTEND.errOf(d);
      return d;
    });
  }
  /* 主催者の画面の日付を、主催者自身のことばで書いてもらうために、毎回 uiLang を送る。
     **団体の設定（参加者に見せることば）とは別物。** */
  function withKey(body) { body.adminKey = adminKey; body.uiLang = ATTEND.lang(); return api(body); }

  /* ---------- 名簿の入力欄 ---------- */
  function memberRow(box, m) {
    var row = document.createElement('div');
    row.className = 'mrow';
    row.innerHTML =
      // 男女の値（男 / 女）は保存される値なので訳さない。見た目のラベルだけ訳す
      '<input class="mname" type="text" placeholder="' + esc(T('adPhName')) + '" autocomplete="off">' +
      '<select class="mgender"><option value="">' + esc(T('adPhGender')) + '</option>' +
      '<option value="男">' + esc(T('adGenderM')) + '</option>' +
      '<option value="女">' + esc(T('adGenderF')) + '</option></select>' +
      '<input class="mnote" type="text" placeholder="' + esc(T('adPhNote')) + '" autocomplete="off" style="max-width:88px;">' +
      '<button class="del" type="button" aria-label="' + esc(T('adDelRow')) + '">×</button>';
    row.querySelector('.mname').value = (m && m.name) || '';
    row.querySelector('.mgender').value = (m && m.gender) || '';
    row.querySelector('.mnote').value = (m && m.note) || '';
    row.querySelector('.del').addEventListener('click', function () { row.remove(); });
    // Enterで次の行へ。1人ずつ打つときに手が止まらないように
    row.querySelector('.mname').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      var rows = [].slice.call(box.querySelectorAll('.mrow'));
      var next = rows[rows.indexOf(row) + 1];
      if (next) next.querySelector('.mname').focus();
      else box.parentNode.querySelector('[data-add]').click();
    });
    box.appendChild(row);
    return row;
  }
  function readMembers(box) {
    return [].slice.call(box.querySelectorAll('.mrow')).map(function (r) {
      return {
        name: r.querySelector('.mname').value.trim(),
        gender: r.querySelector('.mgender').value,
        note: r.querySelector('.mnote').value.trim()
      };
    }).filter(function (m) { return !!m.name; });
  }

  /* ---------- 合鍵を持っていない画面 ----------
     「すでにお持ちの方」と「団体をつくる」は、いつも一緒に出し入れする。
     つくるほうだけ見せると、持っている人が二つめの団体をつくってしまう。 */
  function showStart(on) {
    show($('haveScreen'), on);
    show($('newScreen'), on);
  }

  /* ---------- 管理リンクを貼り付けて開く ----------
     ホーム画面に登録したアプリにはアドレス欄が無く、LINEやメールのリンクを押すと
     別のブラウザ（＝別の入れもの）で開いてしまう。持ち込む道がここしかない。 */
  var pasteTry = false;

  function keyFrom(text) {
    var s = String(text == null ? '' : text).trim();
    if (!s) return '';
    var m = s.match(/[#&?]k=([^&\s#]+)/);
    if (m) return decodeURIComponent(m[1]);
    // 合鍵だけを貼られることもある（32バイトを base64url にした長さ）
    if (/^[A-Za-z0-9_-]{20,}$/.test(s)) return s;
    return '';
  }

  $('haveGo').addEventListener('click', function () {
    var key = keyFrom($('haveKey').value);
    if (!key) {
      say($('haveMsg'), T('adHaveBad'), 'ng');
      return;
    }
    adminKey = key;
    pasteTry = true;
    $('haveKey').value = '';          // 画面に合鍵を残さない
    say($('haveMsg'), T('adHaveOpening'));
    showStart(false);
    load();
  });

  /* ---------- 団体をつくる ---------- */
  var $newRows = $('newRows');
  $('newAdd').setAttribute('data-add', '1');
  for (var i = 0; i < 4; i++) memberRow($newRows, null);
  $('newAdd').addEventListener('click', function () { memberRow($newRows, null).querySelector('.mname').focus(); });

  $('newGo').addEventListener('click', function () {
    var name = $('newOrg').value.trim();
    if (!name) { say($('newMsg'), T('adNeedOrgName'), 'ng'); $('newOrg').focus(); return; }
    var members = readMembers($newRows);
    if (!members.length) { say($('newMsg'), T('adNeedMember'), 'ng'); return; }

    this.disabled = true;
    say($('newMsg'), T('adCreating'));
    api({ action: 'createOrg', name: name, lang: $('newLang').value, members: members }).then(function (d) {
      adminKey = d.adminKey;
      $('keyUrl').value = d.urls.admin;
      showStart(false);
      show($('keyScreen'), true);
      window.scrollTo(0, 0);
    }).catch(function (e) {
      $('newGo').disabled = false;
      say($('newMsg'), e.message, 'ng');
    });
  });

  $('keyGo').addEventListener('click', function () {
    try { history.replaceState(null, '', 'admin.html#k=' + encodeURIComponent(adminKey)); } catch (e) { /* noop */ }
    show($('keyScreen'), false);
    load();
  });

  /* ---------- コピー ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]');
    if (!b) return;
    var input = $(b.getAttribute('data-copy'));
    input.select();
    input.setSelectionRange(0, 99999);
    var done = false;
    try { done = document.execCommand('copy'); } catch (err) { done = false; }
    if (navigator.clipboard) navigator.clipboard.writeText(input.value).catch(function () {});
    b.textContent = T(done || navigator.clipboard ? 'adCopied' : 'adCopyLong');
    setTimeout(function () { b.textContent = T('adCopy'); }, 1600);
  });

  /* ---------- ふだんの画面 ---------- */
  var $edRows = $('edRows');
  $('edAdd').setAttribute('data-add', '1');
  $('edAdd').addEventListener('click', function () { memberRow($edRows, null).querySelector('.mname').focus(); });

  function load() {
    withKey({ action: 'org' }).then(function (d) {
      $('org').textContent = d.org.name;
      $('edOrg').value = d.org.name;
      $('edLang').value = d.org.lang || 'ja';
      // 合鍵はこの端末にしか無い。サーバーは SHA-256 しか持っていないので、組み立てはここで
      $('myUrl').value = d.urls.admin || (d.urls.list.replace(/\/\?s=/, '/admin.html?s=') + '#k=' + encodeURIComponent(adminKey));
      $('u1').value = d.urls.list;

      $edRows.innerHTML = '';
      (d.members || []).forEach(function (m) { memberRow($edRows, m); });
      if (!d.members.length) memberRow($edRows, null);

      show($('home'), true);
      say($('haveMsg'), '');
      paintConn();
      loadTaikai();
      loadEvents();

      var token = inToken || takePending();
      inToken = '';
      if (token) receive(token);
    }).catch(function (e) {
      // 覚えていた合鍵が通らなくなっていたら（団体を消したなど）、記憶のほうを捨てる
      if (e.needKey && pick(REM) === adminKey) store(REM, null);
      show($('home'), false);
      showStart(true);
      // 貼り付けて開こうとしたのなら、返事はその欄のそばに出す
      if (pasteTry) { say($('haveMsg'), e.message, 'ng'); pasteTry = false; adminKey = ''; }
      else if (adminKey) say($('newMsg'), e.message, 'ng');
    });
  }

  /* 行事 */
  var tkRows = [];          // 届いた行事の中身を引くのに使う（一覧に出ているものだけ）
  function loadTaikai(done) {
    return withKey({ action: 'listTaikai' }).then(function (d) {
      tkRows = d.taikai || [];
      var box = $('tkList');
      if (!d.taikai.length) {
        box.innerHTML = '<p class="hint">' + esc(T('adTkNone')) + '</p>';
        show($('tkMore'), false);
        return;
      }
      box.innerHTML = d.taikai.map(function (t) {
        var meta = [];
        if (t.dateText) meta.push(T('adTkDate') + t.dateText);
        if (t.deadlineText) meta.push(T('adTkDead') + t.deadlineText);
        if (t.items.length) meta.push(t.items.join(T('adJoin')));
        return '<div class="tkcard"><div class="n">' + esc(t.name) + '</div>'
          + (meta.length ? '<div class="m">' + esc(meta.join(T('adSep'))) + '</div>' : '')
          + '<div>' + (t.eventId ? '<span class="b yes">' + esc(T('adTkUsed')) + '</span>'
                                    : '<span class="b no">' + esc(T('adTkUnused')) + '</span>') + '</div>'
          + (t.eventId
              // 出欠を作ってある行事は消せない。**理由を書かないと押せない訳が分からない**
              ? '<p class="pend">' + esc(T('adTkLocked')) + '</p>'
              : '<button class="btn wide" style="margin-top:10px;" data-mk="' + esc(t.id) + '" type="button">'
                + esc(T('adTkMake')) + '</button>'
                + '<button class="btn sub wide" style="margin-top:8px;" data-tkdel="' + esc(t.id) + '" data-name="'
                + esc(t.name) + '" type="button">' + esc(T('adTkDel')) + '</button>')
          + '</div>';
      }).join('');

      if (d.total > d.taikai.length) {
        $('tkMore').textContent = T('adTkMore', { n: d.taikai.length, total: d.total });
        show($('tkMore'), true);
      } else { show($('tkMore'), false); }
    }).then(function () { if (done) done(); })
      .catch(function (e) { say($('tkMsg'), e.message, 'ng'); });
  }

  /* ---------- ドロッパーから届いた行事 ----------
     取り込みまでは自動。出欠を受け付けるかどうかは、中身を見せてから1タップで決めてもらう。
     読み違えた締切のまま受付が始まるのがいちばん困るため、ここは自動にしない。 */
  function showIncoming(id) {
    var t = null;
    for (var i = 0; i < tkRows.length; i++) { if (tkRows[i].id === id) t = tkRows[i]; }
    if (!t) { show($('tkIn'), false); return; }

    var meta = [];
    if (t.dateText) meta.push(T('adTkDate') + t.dateText);
    if (t.deadlineText) meta.push(T('adTkDead') + t.deadlineText);
    if (t.items.length) meta.push(t.items.join(T('adJoin')));

    $('tkInName').textContent = t.name;
    $('tkInMeta').textContent = meta.join(T('adSep'));
    $('tkInGo').setAttribute('data-mk', t.id);
    $('tkInGo').disabled = false;
    $('tkInGo').textContent = T('adTkAccept');

    if (t.eventId) {
      say($('tkInMsg'), T('adTkAlready'), 'ok');
      show($('tkInGo'), false);
    } else {
      say($('tkInMsg'), T('adTkImported'), 'ok');
      show($('tkInGo'), true);
    }
    show($('tkIn'), true);
  }

  function receive(token) {
    show($('tkIn'), true);
    show($('tkInGo'), false);
    $('tkInName').textContent = T('adTkFrom');
    $('tkInMeta').textContent = '';
    say($('tkInMsg'), T('adTkImporting'));

    withKey({ action: 'importTaikai', token: token }).then(function (d) {
      loadTaikai(function () { showIncoming(d.taikaiId); });
    }).catch(function (e) {
      say($('tkInMsg'), e.message, 'ng');
    });
  }

  $('tkInLater').addEventListener('click', function () { show($('tkIn'), false); });

  /* 出欠ができたことを、ドロッパーに知らせる。
     ドロッパーは案内文の「メニューの出欠入力から」を、**これが届いたときだけ**出す。
     送っただけで受付を始めずに閉じた場合に、案内文が嘘になるのを防ぐため。

     別タブなら opener へ postMessage、同じ画面で来たなら端末に印を置く。
     **両方いる。** ホーム画面のアプリには opener が無く、ふつうのブラウザは
     戻っても読み直しが起きない。

     ★ 出欠を入力するURLも一緒に渡す。LINEの無い国では、案内文にこのURLが要る
     （リッチメニューが無いので、書かないと参加者はどこからも辿り着けない）。
     団体につき1本で行事が増えても変わらないので、渡すのはこれだけでよい。 */
  function tellDropper(name, date) {
    // 出欠を入力するURL（配る3本の1本目）。load() が入れているので、そこから取る
    var url = $('u1').value || '';
    var note = { name: name, date: date, url: url, at: Date.now() };
    store('dropperAttendDone', JSON.stringify(note));
    var o = opener();
    if (o) {
      try {
        o.postMessage({ type: 'attend-created', name: name, date: date, url: url }, location.origin);
      } catch (e) { /* noop */ }
    }
  }

  $('tkInGo').addEventListener('click', function () {
    var b = this;
    b.disabled = true;
    b.textContent = T('adTkAccepting');
    withKey({ action: 'createEventFromTaikai', taikaiId: b.getAttribute('data-mk') })
      .then(function () {
        var row = null;
        for (var i = 0; i < tkRows.length; i++) {
          if (tkRows[i].id === b.getAttribute('data-mk')) row = tkRows[i];
        }
        if (row) tellDropper(row.name, row.date);

        show($('tkInGo'), false);
        loadTaikai();
        loadEvents();

        // ドロッパーから来たのなら、案内文づくりに戻ってもらう。順番はここで決まる
        if (backWay) {
          say($('tkInMsg'), T('adTkStartedBack'), 'ok');
          setTimeout(goBack, 1400);
        } else {
          say($('tkInMsg'), T('adTkStarted'), 'ok');
        }
      })
      .catch(function (err) {
        b.disabled = false;
        b.textContent = T('adTkAccept');
        say($('tkInMsg'), err.message, 'ng');
      });
  });

  /* ---------- この端末に覚える ----------
     覚えておくと、ドロッパーの「出欠システムに保存」から直にここへ取り込める。
     覚えないと、届いた行事は預かるが、毎回ご自分の管理リンクを開き直すことになる。 */
  function paintConn() {
    var on = pick(REM) && pick(REM) === adminKey;
    $('connNote').innerHTML = on ? T('adConnOn')
      : (T('adConnOff') + (pasteTry ? T('adConnPaste') : ''));
    $('connGo').textContent = T(on ? 'adConnForget' : 'adConnRemember');
  }

  $('myShow').addEventListener('click', function () {
    var on = $('myBox').hidden;
    show($('myBox'), on);
    this.textContent = T(on ? 'adMyHide' : 'adMyShow');
  });

  $('connGo').addEventListener('click', function () {
    var on = pick(REM) && pick(REM) === adminKey;
    if (on) {
      store(REM, null);
      paintConn();
      return;
    }
    if (!store(REM, adminKey)) {
      say($('tkMsg'), T('adConnNoStore'), 'ng');
      return;
    }
    paintConn();
  });

  $('tkImport').addEventListener('click', function () {
    var token = $('tkToken').value.trim();
    if (!token) { say($('tkMsg'), T('adPasteEmpty'), 'ng'); return; }
    this.disabled = true;
    say($('tkMsg'), T('adTkImporting'));
    withKey({ action: 'importTaikai', token: token }).then(function (d) {
      $('tkToken').value = '';
      say($('tkMsg'), T(d.existing ? 'adTkExistsMsg' : 'adTkImportedMsg', { name: d.name }), 'ok');
      $('tkImport').disabled = false;
      loadTaikai();
    }).catch(function (e) {
      $('tkImport').disabled = false;
      say($('tkMsg'), e.message, 'ng');
    });
  });

  $('tkPasteBtn').addEventListener('click', function () {
    var on = $('tkPaste').hidden;
    show($('tkPaste'), on);
    this.textContent = T(on ? 'adPasteClose' : 'adPasteOpen');
    if (on) $('tkToken').focus();
  });

  $('tkManualBtn').addEventListener('click', function () {
    var on = $('tkManual').hidden;
    show($('tkManual'), on);
    this.textContent = T(on ? 'adManualClose' : 'adManualOpen');
  });

  $('mkGo').addEventListener('click', function () {
    var name = $('mkName').value.trim();
    if (!name) { say($('mkMsg'), T('adMkNeedName'), 'ng'); return; }
    this.disabled = true;
    withKey({
      action: 'addTaikaiManually', name: name,
      date: $('mkDate').value, deadline: $('mkDead').value,
      place: $('mkPlace').value, items: $('mkItems').value
    }).then(function (d) {
      $('mkName').value = ''; $('mkDate').value = ''; $('mkDead').value = '';
      $('mkPlace').value = ''; $('mkItems').value = '';
      say($('mkMsg'), T(d.existing ? 'adMkExists' : 'adMkAdded'), 'ok');
      $('mkGo').disabled = false;
      loadTaikai();
    }).catch(function (e) { $('mkGo').disabled = false; say($('mkMsg'), e.message, 'ng'); });
  });

  // 行事一覧は作り直すので、押されたIDで引く
  $('tkList').addEventListener('click', function (e) {
    var d = e.target.closest('[data-tkdel]');
    if (d) {
      if (!window.confirm(T('adTkDelAsk', { name: d.getAttribute('data-name') }))) return;
      d.disabled = true;
      withKey({ action: 'deleteTaikai', taikaiId: d.getAttribute('data-tkdel') })
        .then(function () { say($('tkMsg'), T('adTkDeleted'), 'ok'); loadTaikai(); })
        .catch(function (err) { d.disabled = false; say($('tkMsg'), err.message, 'ng'); });
      return;
    }

    var b = e.target.closest('[data-mk]');
    if (!b) return;
    b.disabled = true;
    b.textContent = T('adTkMaking');
    withKey({ action: 'createEventFromTaikai', taikaiId: b.getAttribute('data-mk') })
      .then(function () { loadTaikai(); loadEvents(); })
      .catch(function (err) {
        b.disabled = false;
        b.textContent = T('adTkMake');
        say($('tkMsg'), err.message, 'ng');
      });
  });

  /* 出欠 */
  function loadEvents() {
    withKey({ action: 'adminEvents' }).then(function (d) {
      var box = $('evList');
      if (!d.events.length) {
        box.innerHTML = '<p class="hint">' + esc(T('adEvNone')) + '</p>';
        return;
      }
      box.innerHTML = d.events.map(function (ev) {
        var meta = [];
        if (ev.date) meta.push(T('adTkDate') + ev.date);
        if (ev.deadline) meta.push(T('adTkDead') + ev.deadline);
        // 「手で締めた」と「締切日をすぎた」は分けて出す。
        // 同じ「締切ずみ」に見えると、再開できるのかどうか分からない
        var state = '<span class="b ' + (ev.manualClosed || ev.datePassed ? 'no' : 'yes') + '">'
          + esc(T(ev.manualClosed ? 'adEvManual' : ev.datePassed ? 'adEvPassed' : 'adEvOpen')) + '</span>';
        return '<div class="tkcard"><div class="n">' + esc(ev.name) + '</div>'
          + (meta.length ? '<div class="m">' + esc(meta.join(T('adSep'))) + '</div>' : '')
          + '<div>' + state
          + ' <span class="b no">' + esc(T('adEvResp', { n: Number(ev.respCount || 0) })) + '</span></div>'
          + ATTEND.summaryHtml(ev)
          + (ev.pending && ev.pending.length
              ? '<p class="pend">' + esc(T('adEvPending', { n: ev.pending.length, names: ev.pending.join(T('adJoin')) })) + '</p>'
              : '<p class="pend">' + esc(T('adEvAllIn')) + '</p>')
          // 締切日をすぎたぶんは再開しても受け付けられない（日付で閉じるため）。
          // 押せるように見せると混乱するので、その場合はボタンを出さない
          + (ev.datePassed && !ev.manualClosed
              ? ''
              : '<button class="btn sub wide" style="margin-top:10px;" data-close="' + esc(ev.id) + '" data-now="'
                + (ev.manualClosed ? '1' : '0') + '" type="button">'
                + esc(T(ev.manualClosed ? 'adEvReopen' : 'adEvClose')) + '</button>')
          + '<button class="btn sub wide del-ev" style="margin-top:8px;" data-evdel="' + esc(ev.id) + '" data-name="'
          + esc(ev.name) + '" data-n="' + Number(ev.respCount || 0) + '" type="button">' + esc(T('adEvDel')) + '</button>'
          + '</div>';
      }).join('');
    }).catch(function () { /* 画面上部で伝えるので、ここでは黙る */ });
  }

  $('evList').addEventListener('click', function (e) {
    var d = e.target.closest('[data-evdel]');
    if (d) {
      var n = Number(d.getAttribute('data-n') || 0);
      // 何人ぶんの回答が消えるかを先に言う。あとから「消えると思わなかった」を防ぐため
      var msg = T('adEvDelAsk1', { name: d.getAttribute('data-name') }) + '\n'
        + (n ? T('adEvDelAsk2', { n: n }) + '\n' : '')
        + T('adEvDelAsk3');
      if (!window.confirm(msg)) return;
      d.disabled = true;
      withKey({ action: 'deleteEvent', eventId: d.getAttribute('data-evdel') })
        .then(function () { loadEvents(); loadTaikai(); })
        .catch(function () { d.disabled = false; });
      return;
    }

    var b = e.target.closest('[data-close]');
    if (!b) return;
    b.disabled = true;
    withKey({ action: 'closeEvent', eventId: b.getAttribute('data-close'), closed: b.getAttribute('data-now') !== '1' })
      .then(loadEvents)
      .catch(function () { b.disabled = false; });
  });

  /* 団体名と名簿 */
  $('edSave').addEventListener('click', function () {
    var name = $('edOrg').value.trim();
    var members = readMembers($edRows);
    if (!name) { say($('edMsg'), T('adNeedOrgName'), 'ng'); return; }
    if (!members.length) { say($('edMsg'), T('adNeedMember'), 'ng'); return; }

    this.disabled = true;
    say($('edMsg'), T('adSaving'));
    withKey({ action: 'saveOrg', name: name, lang: $('edLang').value })
      .then(function () { return withKey({ action: 'saveMembers', members: members }); })
      .then(function () {
        $('edSave').disabled = false;
        $('org').textContent = name;
        say($('edMsg'), T('adSaved'), 'ok');
        loadEvents();   // 未回答者の顔ぶれが変わる
      })
      .catch(function (e) { $('edSave').disabled = false; say($('edMsg'), e.message, 'ng'); });
  });

  /* 削除 */
  $('delGo').addEventListener('click', function () {
    var name = $('delName').value.trim();
    if (!name) { say($('delMsg'), T('adDelNeedName'), 'ng'); return; }
    if (!window.confirm(T('adDelAsk'))) return;

    this.disabled = true;
    withKey({ action: 'deleteOrg', confirm: name }).then(function () {
      if (pick(REM) === adminKey) store(REM, null);   // 消えた団体の合鍵を端末に残さない
      document.body.innerHTML =
        '<header><h1>' + esc(T('adDelDoneT')) + '</h1></header>'
        + '<div class="wiz"><section class="step"><p>' + esc(T('adDelDoneB')) + '</p></section></div>';
    }).catch(function (e) { $('delGo').disabled = false; say($('delMsg'), e.message, 'ng'); });
  });

  /* ---------- ドロッパーへ帰る ----------
     ドロッパーからの来かたが2通りあり、帰り方も2通りになる。

       別のタブで開かれた（ふつうのブラウザ）  → 閉じる。もとのタブがそのまま残っている
       同じ画面で来た（ホーム画面のアプリ）    → 前の画面へ戻る。タブが1枚しかないため

     ホーム画面のアプリはブラウザとは別の入れものなので、そこから新しいタブを開くと
     記憶もログインも無いブラウザ側に飛び出す。だからドロッパー側が同じ画面で来る。 */
  function opener() {
    try { return window.opener && !window.opener.closed ? window.opener : null; }
    catch (e) { return null; }   // 別の出どころから開かれていたら触れない
  }

  /* 「戻る」を出してよいのは、直前がドロッパーだったときだけ。
     #t= を持っているかどうかでは判断しない（リンクを手で開いた場合、戻り先が別物になる）。 */
  var fromDropper = /^https?:\/\/[^/]+\/calendar(-[a-z]+)?\//.test(document.referrer || '');
  var backWay = opener() ? 'close' : (fromDropper && history.length > 1 ? 'back' : '');
  if (backWay) show($('backBar'), true);

  function goBack() {
    if (!backWay) return;
    if (backWay === 'back') { history.back(); return; }

    var o = opener();
    if (o) { try { o.focus(); } catch (e) { /* noop */ } }
    window.close();
    // 閉じさせてもらえない端末がある。そのときのために、行き先を伝えておく
    setTimeout(function () {
      $('backMsg').textContent = T('adBackDone');
    }, 400);
  }

  $('backGo').addEventListener('click', goBack);

  /* ---------- 入口 ----------
     この画面を開いたまま管理リンク（#k=…）を開くと、ブラウザは # だけ差し替えて
     読み直さない。合鍵が届いたことに気づけないので、読み直させる。 */
  window.addEventListener('hashchange', function () { location.reload(); });

  if (adminKey) {
    load();
  } else {
    showStart(true);
    // 合鍵が無いのに行事が届いた。捨てずに預かって、管理リンクで開き直してもらう
    if (inToken) {
      keepPending(inToken);
      say($('haveMsg'), T('adPending'), 'ok');
    }
  }
})();
</script>
</body>
</html>
