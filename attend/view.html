<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title data-i18n-title="vwTitle">出欠の確認（役員用）</title>
<link rel="stylesheet" href="attend.css?v=20260839">
</head>
<body>

<header>
  <h1 id="h1" data-i18n="vwHead">出欠の確認</h1>
  <p id="org"></p>
</header>

<section class="view">
  <div class="legend">
    <span class="lg-o"><b>〇</b> <span data-i18n="choiceYes">参加</span></span>
    <span class="lg-s"><b>△</b> <span data-i18n="choiceMaybe">どちらでも</span></span>
    <span class="lg-x"><b>×</b> <span data-i18n="choiceNo">不参加</span></span>
    <span class="lg-n"><b data-i18n="noAnswer">未回答</b> <span data-i18n="legendNone">まだ答えていない</span></span>
  </div>
  <div class="bar"><button class="refresh" id="refresh" type="button" data-i18n="refresh">最新に更新</button></div>
  <div class="wrap" id="wrap"></div>
  <p class="foot" id="foot" data-i18n="vwFoot">この画面は見るだけです。回答や名簿は変えられません。</p>
</section>

<script src="attend.js?v=20260839"></script>
<script>
/* ===== 役員に見せる閲覧画面 =====

   主催者の合鍵（管理リンク）は**全権**で、渡すと団体ごと消せる。しかも再発行の口が
   無いので取り消せない。出欠状況を見せたいだけの役員に渡すものではない。
   そこで**別の鍵**を発行し、この画面だけを開けるようにした（2026-08-26）。

   ★ この画面には**書き換える口が1つも無い**。呼ぶのは viewSummary だけで、
     サーバー側も authOrgView を通るのはその1本だけにしてある。
     **ここに操作を足さないこと。** 足すなら合鍵の要る管理画面へ。

   ★ 鍵は `#v=` に入れる。`?` に載せるとアクセスログと Referer に残る（合鍵と同じ扱い）。

   ★ ことばは**団体の言語**に従う。役員は参加者と同じ側なので、選ばせない。

   ★ 参加者向けの「みんなの回答」（index.html の #status）とは別物。
     あちらは団体の設定しだいで名前が出ず、未回答者は決して出ない。
     こちらは**常に名前を出し、未回答者も出す**（声かけのための画面だから）。 */
(function () {
  'use strict';
  var A = window.ATTEND;
  var esc = A.esc;
  var T = A.t;

  A.addDict({
    ja: {
      vwTitle: '出欠の確認（役員用）',
      vwHead: '出欠の確認',
      vwFoot: 'この画面は見るだけです。回答や名簿は変えられません。',
      vwPending: 'まだ答えていない方',
      vwPendingN: 'まだ答えていない方（{n}）',
      vwPendingNone: '全員が答えました。',
      vwNoKey: 'リンクが正しくありません。主催者からもらった閲覧リンクを、そのままお使いください。',
      vwNoData: 'まだ出欠がありません。',
      vwNoDataTitle: '出欠がまだありません',
      vwJoin: '、',
      err_viewKeyMissing: 'リンクが正しくありません。主催者からもらった閲覧リンクを、そのままお使いください。',
      err_viewKeyBad: 'この閲覧リンクは使えません。作り直された可能性があります。主催者に新しいリンクをお尋ねください。'
    },
    en: {
      vwTitle: 'Attendance (for officers)',
      vwHead: 'Attendance',
      vwFoot: 'This page is read-only. Answers and the roster cannot be changed here.',
      vwPending: 'Not answered yet',
      vwPendingN: 'Not answered yet ({n})',
      vwPendingNone: 'Everyone has answered.',
      vwNoKey: 'That link is not right. Please use the viewing link exactly as the organiser sent it.',
      vwNoData: 'No attendance yet.',
      vwNoDataTitle: 'No attendance yet',
      vwJoin: ', ',
      err_viewKeyMissing: 'That link is not right. Please use the viewing link exactly as the organiser sent it.',
      err_viewKeyBad: 'This viewing link no longer works. It may have been reissued — please ask the organiser for a new one.'
    },
    in: {
      vwTitle: 'Attendance (officers ke liye)',
      vwHead: 'Attendance',
      vwFoot: 'Yeh page sirf dekhne ke liye hai. Jawab aur roster yahan se nahi badal sakte.',
      vwPending: 'Abhi tak jawab nahi diya',
      vwPendingN: 'Abhi tak jawab nahi diya ({n})',
      vwPendingNone: 'Sabne jawab de diya.',
      vwNoKey: 'Link theek nahi hai. Organiser ne jo viewing link bheja hai, wahi use karein.',
      vwNoData: 'Abhi koi attendance nahi hai.',
      vwNoDataTitle: 'Abhi koi attendance nahi hai',
      vwJoin: ', ',
      err_viewKeyMissing: 'Link theek nahi hai. Organiser ne jo viewing link bheja hai, wahi use karein.',
      err_viewKeyBad: 'Yeh viewing link ab kaam nahi karta. Shayad naya bana diya gaya hai — organiser se naya link maangein.'
    }
  });
  A.applyDom();

  var $wrap = document.getElementById('wrap');
  var $org = document.getElementById('org');

  /* 鍵は # から取る。**URLからは消さない** —— 役員は LINE のメッセージから
     毎回開くので、消すと再読み込みで開けなくなる（管理画面も `#k=` を残している）。 */
  function takeKey() {
    var m = /[#&]v=([^&]+)/.exec(window.location.hash || '');
    if (!m) return '';
    var k = '';
    try { k = decodeURIComponent(m[1]); } catch (e) { k = m[1]; }
    return k;
  }
  var viewKey = takeKey();

  if (!A.orgId || !viewKey) {
    $wrap.innerHTML = A.noteHtml(T('failTitle'), T('vwNoKey'), true);
    return;
  }

  /* 合鍵と同じく、鍵は**POSTの本文**で送る。クエリには決して載せない。 */
  function ask() {
    return fetch(A.API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'viewSummary', s: A.orgId, viewKey: viewKey })
    }).then(function (r) { return r.text(); }).then(function (text) {
      var d;
      try { d = JSON.parse(text); } catch (e) { throw new Error(T('errNotJson')); }
      if (!d || d.ok !== true) throw A.errOf(d);
      return d;
    });
  }

  /* まだ答えていない方。**この画面にしか出ない。**
     参加者向けの応答には決して入れないこと（声かけのためのもので、晒すためではない）。 */
  function pendingHtml(sum) {
    var list = sum.pending || [];
    if (!list.length) {
      return '<div class="evmemo"><div class="h">' + esc(T('vwPending')) + '</div>'
        + '<p class="b">' + esc(T('vwPendingNone')) + '</p></div>';
    }
    return '<div class="evmemo"><div class="h">'
      + esc(T('vwPendingN', { n: list.length })) + '</div>'
      + '<p class="b">' + list.map(esc).join(T('vwJoin')) + '</p></div>';
  }

  function render(list) {
    if (!list.length) {
      $wrap.innerHTML = A.noteHtml(T('vwNoDataTitle'), T('vwNoData'));
      return;
    }
    $wrap.innerHTML = list.map(function (sum) {
      return '<div class="card"><div class="card-head no-border">'
        + '<h2>' + esc(sum.name) + '</h2>'
        + A.metaHtml(sum)
        + A.memoHtml(sum)
        + '</div>'
        + A.summaryHtml(sum)
        + pendingHtml(sum)
        + '</div>';
    }).join('');
  }

  function load(isReload) {
    $wrap.innerHTML = A.loadingHtml(isReload ? T('refreshing') : T('loading'));
    return ask().then(function (d) {
      if (d.lang) A.setLang(d.lang);      // ことばは団体に合わせる
      if (d.org) { $org.textContent = d.org; A.setTitle('vwTitle', d.org); }
      render(d.summaries || []);
    }).catch(function (err) {
      $wrap.innerHTML = A.noteHtml(T('failTitle'), String(err && err.message || err), true);
    });
  }

  document.getElementById('refresh').addEventListener('click', function () { load(true); });
  load(false);
})();
</script>
</body>
</html>
