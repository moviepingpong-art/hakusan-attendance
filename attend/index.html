<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title data-i18n-title="answerTitle">出欠を回答する</title>
<link rel="stylesheet" href="attend.css?v=20260827">
</head>
<body class="has-tabs">

<header>
  <h1 id="h1" data-i18n="answerHead">出欠の回答</h1>
  <p id="org"></p>
</header>

<!-- ① 出欠入力 -->
<section class="view" id="v-answer">
  <div class="me" id="me"></div>
  <div class="wrap" id="wrap"></div>
  <p class="foot" id="foot"></p>
</section>

<!-- ② わたしの回答（中身は attend-views.js。my.html と同じ実体） -->
<section class="view" id="v-my" hidden>
  <div class="me" id="myMe"></div>
  <div class="legend">
    <span class="lg-o"><b>〇</b> <span data-i18n="choiceYes">参加</span></span>
    <span class="lg-s"><b>△</b> <span data-i18n="choiceMaybe">どちらでも</span></span>
    <span class="lg-x"><b>×</b> <span data-i18n="choiceNo">不参加</span></span>
    <span class="lg-n"><b data-i18n="noAnswer">未回答</b> <span data-i18n="legendNone">まだ答えていない</span></span>
  </div>
  <div class="bar"><button class="refresh" id="myRefresh" type="button" data-i18n="refresh">最新に更新</button></div>
  <div class="wrap" id="myWrap"></div>
</section>

<!-- ③ 集まり具合（中身は attend-views.js。status.html と同じ実体） -->
<section class="view" id="v-status" hidden>
  <div class="bar"><button class="refresh" id="stRefresh" type="button" data-i18n="refresh">最新に更新</button></div>
  <div class="wrap" id="stWrap"></div>
  <p class="foot" data-i18n="footStatus">※ 人数のみ表示しています（どなたが回答したかは表示されません）。締切前は途中経過のため変わります。</p>
</section>

<!-- Webで配るのはこの1本だけ。LINEのリッチメニューから来た人は、
     今までどおり my.html / status.html を直接開く（あちらにタブは出さない）。 -->
<nav class="tabs" id="tabs">
  <button class="tab" type="button" data-tab="answer" data-i18n="tabAnswer">出欠入力</button>
  <button class="tab" type="button" data-tab="my" data-i18n="tabMy">わたしの回答</button>
  <button class="tab" type="button" data-tab="status" data-i18n="tabStatus">集まり具合</button>
</nav>

<script src="attend.js?v=20260827"></script>
<script src="attend-views.js?v=20260827"></script>
<script>
(function () {
  'use strict';

  var $wrap = document.getElementById('wrap');
  var $me   = document.getElementById('me');
  var $org  = document.getElementById('org');
  var $foot = document.getElementById('foot');
  var $h1   = document.getElementById('h1');

  var esc = ATTEND.esc;
  var T = ATTEND.t;
  var device = ATTEND.deviceId();
  var member = null;          // {name, gender}
  var events = [];            // 表示中のイベント
  var picks  = {};            // picks[イベントID][種目] = '〇' | '△' | '×'
  var orgName = '';

  $wrap.innerHTML = ATTEND.loadingHtml();
  if (ATTEND.requireOrgId($wrap)) {
    // ?s= が無ければどのタブも開けない。道だけ残しても空振りするので畳む
    document.getElementById('tabs').hidden = true;
    document.body.classList.remove('has-tabs');
    return;
  }

  $wrap.addEventListener('click', onTap);   // 委譲は1回だけ登録する（再描画しても増やさない）
  $wrap.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var c = e.target.closest('.choice');
    if (c) { e.preventDefault(); choose(c); }
  });

  /* ============================================================
   *  タブ
   *  3つの画面をそれぞれの器に持たせ、切り替えでは中身を捨てない。
   *  ひとつの器を使い回すと、回答の途中で「集まり具合」を見に行った人が
   *  戻ったときに、まだ送っていない〇△×を失う。
   * ========================================================== */

  var TABS = {
    answer: { box: 'v-answer', head: 'answerHead',  title: 'answerTitle' },
    my:     { box: 'v-my',     head: 'myTitle',     title: 'myTitle' },
    status: { box: 'v-status', head: 'statusTitle', title: 'statusTitle' }
  };

  var answerLoaded = false;
  var myView = null;
  var statusView = null;

  function tabFromHash() {
    var h = String(location.hash || '').replace(/^#/, '');
    return TABS[h] ? h : 'answer';
  }

  function showTab(name, keepHash) {
    if (!TABS[name]) name = 'answer';

    Object.keys(TABS).forEach(function (k) {
      document.getElementById(TABS[k].box).hidden = (k !== name);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tabs .tab'), function (b) {
      var on = b.getAttribute('data-tab') === name;
      b.classList.toggle('on', on);
      b.setAttribute('aria-current', on ? 'page' : 'false');
    });

    // 見出しはタブに合わせて変える。data-i18n も付け替えておかないと、
    // あとで団体の言語が届いたときに applyDom が「出欠の回答」に戻してしまう
    $h1.setAttribute('data-i18n', TABS[name].head);
    $h1.textContent = T(TABS[name].head);
    ATTEND.setTitle(TABS[name].title, orgName);

    if (!keepHash) {
      // 履歴は積まない。LINE内ブラウザでは「戻る」が閉じるに近い意味を持つので、
      // タブを替えただけで戻る回数が増えるのは邪魔になる
      var base = location.pathname + location.search;
      try { history.replaceState(null, '', name === 'answer' ? base : base + '#' + name); } catch (e) { /* noop */ }
    }

    if (name === 'answer') {
      if (!answerLoaded) { answerLoaded = true; load(); }
      return;
    }
    if (name === 'my') {
      if (!myView) {
        myView = ATTEND.views.my.create({
          wrap: document.getElementById('myWrap'),
          me:   document.getElementById('myMe'),
          org:  $org
        });
      }
      myView.load(false);
      return;
    }
    if (!statusView) {
      statusView = ATTEND.views.status.create({
        wrap: document.getElementById('stWrap'),
        org:  $org
      });
    }
    statusView.load(false);
  }

  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (b) showTab(b.getAttribute('data-tab'));
  });
  window.addEventListener('hashchange', function () { showTab(tabFromHash(), true); });

  document.getElementById('myRefresh').addEventListener('click', function () { if (myView) myView.load(true); });
  document.getElementById('stRefresh').addEventListener('click', function () { if (statusView) statusView.load(true); });

  // 「わたしの回答」から回答フォームへ戻る導線。行事を指していないもの（未登録の案内）は
  // ページを読み直さずタブを替えるだけでよい。行事ごとの「回答を変更する」は
  // ?e= を付けて開き直す必要があるので、そのまま移らせる
  document.getElementById('v-my').addEventListener('click', function (e) {
    if (!e.target.closest('[data-goform="list"]')) return;
    e.preventDefault();
    showTab('answer');
  });

  // ほかの画面から戻ってきたら、開いているタブだけ最新化する
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (myView && !document.getElementById('v-my').hidden) myView.load(true);
    if (statusView && !document.getElementById('v-status').hidden) statusView.load(true);
  });

  showTab(tabFromHash(), true);

  /* ============================================================
   *  ここから下は出欠入力。まとめる前の index.html のまま
   * ========================================================== */

  /* ===== 読み込み ===== */
  function load() {
    $wrap.innerHTML = ATTEND.loadingHtml();
    var req = ATTEND.eventId
      ? ATTEND.get('event', { e: ATTEND.eventId, d: device })
      : ATTEND.get('', { d: device });

    req.then(function (data) {
      setOrg(data.org);
      member = data.member || null;
      events = ATTEND.eventId ? [data.event] : (data.events || []);
      if (!member) { showNamePicker(); return; }
      renderMe();
      renderEvents();
    }).catch(fail);
  }

  function setOrg(org) {
    if (!org) return;
    orgName = org;
    $org.textContent = org;
    ATTEND.setTitle('answerTitle', org);
  }

  function fail(err) {
    $wrap.innerHTML = ATTEND.noteHtml(T('failTitle'), String(err && err.message || err), true);
    $wrap.insertAdjacentHTML('beforeend',
      '<button class="ghost" type="button" id="retry">' + esc(T('retry')) + '</button>');
    document.getElementById('retry').addEventListener('click', load);
  }

  /* ===== 初回：名簿から自分の名前を選ぶ ===== */
  function showNamePicker() {
    $me.innerHTML = '';
    $wrap.innerHTML = ATTEND.loadingHtml(T('loadingRoster'));

    ATTEND.get('members').then(function (data) {
      setOrg(data.org);
      var members = data.members || [];
      if (!members.length) {
        $wrap.innerHTML = ATTEND.noteHtml(T('emptyRosterTitle'), T('emptyRosterBody'), true);
        return;
      }

      var html = '<div class="card"><div class="reg">'
        + '<h2>' + esc(T('firstTitle')) + '</h2>'
        + '<p class="lead">' + esc(T('firstLead')) + '</p>'
        + '<div class="names" id="names">'
        + members.map(function (m, i) {
            return '<div class="nbtn" data-i="' + i + '" role="button" tabindex="0">' + esc(m.name) + '</div>';
          }).join('')
        + '</div>'
        + '<button class="reg-confirm" id="regBtn" type="button" disabled>' + esc(T('regBtn')) + '</button>'
        + '<p class="reg-msg" id="regMsg"></p>'
        + '</div></div>';
      $wrap.innerHTML = html;

      var $names = document.getElementById('names');
      var $btn = document.getElementById('regBtn');
      var chosen = null;

      function pick(el) {
        if (!el) return;
        Array.prototype.forEach.call($names.querySelectorAll('.nbtn'), function (x) { x.classList.remove('sel'); });
        el.classList.add('sel');
        chosen = members[Number(el.dataset.i)];
        $btn.disabled = false;
      }
      $names.addEventListener('click', function (e) { pick(e.target.closest('.nbtn')); });
      $names.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(e.target.closest('.nbtn')); }
      });

      $btn.addEventListener('click', function () {
        if (!chosen) return;
        var $msg = document.getElementById('regMsg');
        $btn.disabled = true;
        $msg.className = 'reg-msg';
        $msg.textContent = T('regBusy');

        ATTEND.post({ action: 'register', deviceId: device, name: chosen.name })
          .then(function (res) {
            member = res.member;
            load();
          })
          .catch(function (err) {
            $msg.className = 'reg-msg ng';
            $msg.textContent = String(err && err.message || err);
            $btn.disabled = false;
          });
      });
    }).catch(fail);
  }

  function renderMe() {
    // 名前は太字にしたいので、文言を名前の前後で割る
    var as = T('meAs', { name: '\u0000' }).split('\u0000');
    $me.innerHTML = '<span>' + esc(as[0]) + '<b>' + esc(member.name) + '</b>' + esc(as[1] || '') + '</span>'
      + '<button type="button" class="relink" id="relink">' + esc(T('relink')) + '</button>';
    document.getElementById('relink').addEventListener('click', function () {
      member = null;
      showNamePicker();
    });
  }

  /* ===== 回答フォーム ===== */
  function renderEvents() {
    if (!events.length || !events[0]) {
      $wrap.innerHTML = ATTEND.noteHtml(T('noEventsTitle'), T('noEventsBody'));
      return;
    }

    // 一覧モードは「選んでから回答」。全部ひらいて縦に並べると、
    // イベントが増えるほど目的のものに辿り着けなくなる。
    if (!ATTEND.eventId) { renderList(); return; }

    picks = {};
    $wrap.innerHTML = events.map(cardHtml).join('')
      + '<a class="ghost" href="?s=' + esc(encodeURIComponent(ATTEND.orgId)) + '">' + esc(T('backList')) + '</a>';
    $foot.textContent = '';

    events.forEach(function (ev) {
      picks[ev.id] = {};
      var mine = ev.mine || {};
      ev.items.forEach(function (it) { if (mine[it]) picks[ev.id][it] = mine[it]; });
    });
  }

  /** 一覧（見出しだけ）。タップすると個別の回答画面へ */
  function renderList() {
    $wrap.innerHTML = events.map(function (ev) {
      var mine = ev.mine || {};
      var done = (ev.items || []).filter(function (it) { return !!mine[it]; }).length;
      var pill = !done ? '<span class="status st-none">' + esc(T('noAnswer')) + '</span>'
        : (done === ev.items.length ? '<span class="status st-done">' + esc(T('pillDone')) + '</span>'
                                    : '<span class="status st-part">' + esc(T('pillPart')) + '</span>');
      // カード全体を <a> で包まないこと。中にリンクを置くとアンカーの入れ子になり、
      // ブラウザが外側の <a> をそこで閉じてしまう。
      // 要項・地図・カレンダーは一覧には出さない（選んだ先の回答画面に置いてある）。
      return '<div class="card evcard">'
        + '<div class="card-head no-border"><h2>' + esc(ev.name) + '</h2>'
        + ATTEND.metaHtml(ev)
        + '<div class="evrow">' + pill + '</div>'
        + '</div>'
        + '<a class="ghost evgo" href="' + esc(eventUrl(ev.id)) + '">' + esc(T('goAnswer')) + '</a>'
        + '</div>';
    }).join('');
    $foot.textContent = T('footList');
  }

  function eventUrl(id) {
    return '?s=' + encodeURIComponent(ATTEND.orgId) + '&e=' + encodeURIComponent(id);
  }

  function cardHtml(ev) {
    var mine = ev.mine || {};
    var answered = Object.keys(mine).length > 0;

    var head = '<div class="card-head"><h2>' + esc(ev.name) + '</h2>'
      + ATTEND.metaHtml(ev)
      + (ev.closed ? '<div><span class="badge closed">' + esc(T('closedBadge')) + '</span></div>'
                   : (answered ? '<div><span class="status st-done">' + esc(T('doneEditable')) + '</span></div>' : ''))
      // 要項・地図・カレンダーはここに置く。案内文からURLを外したぶんの受け皿
      + ATTEND.linksHtml(ev)
      + '</div>';

    if (ev.closed) {
      return '<div class="card" data-id="' + esc(ev.id) + '">' + head
        + ATTEND.noteHtml('', T('closedBody'))
        + '<button class="ghost" type="button" data-sum="' + esc(ev.id) + '">' + esc(T('showSummary')) + '</button>'
        + '<div class="sumbox" id="sum-' + esc(ev.id) + '"></div>'
        + '</div>';
    }

    var items = ev.items.map(function (it) {
      var cur = mine[it] || '';
      return '<div class="item"><div class="name">' + esc(it) + '</div>'
        + '<div class="choices" data-id="' + esc(ev.id) + '" data-item="' + esc(it) + '">'
        + ATTEND.choices().map(function (c) {
            var on = (cur === c.key) ? ' ' + c.cls : '';
            return '<div class="choice' + on + '" data-key="' + c.key + '" data-cls="' + c.cls + '" role="button" tabindex="0">'
              + '<span class="mark">' + c.key + '</span><span class="lab">' + c.lab + '</span></div>';
          }).join('')
        + '</div></div>';
    }).join('');

    return '<div class="card" data-id="' + esc(ev.id) + '">' + head + items
      + '<button class="submit" type="button" data-send="' + esc(ev.id) + '">'
      + esc(answered ? T('sendAgain') : T('sendNew')) + '</button>'
      + '<p class="card-msg" id="msg-' + esc(ev.id) + '"></p>'
      + '<button class="ghost" type="button" data-sum="' + esc(ev.id) + '">' + esc(T('showSummary')) + '</button>'
      + '<div class="sumbox" id="sum-' + esc(ev.id) + '"></div>'
      + '</div>';
  }

  function onTap(e) {
    var choice = e.target.closest('.choice');
    if (choice) { choose(choice); return; }

    var send = e.target.closest('[data-send]');
    if (send) { submit(send.dataset.send); return; }

    var sum = e.target.closest('[data-sum]');
    if (sum) { showSummary(sum.dataset.sum, sum); return; }
  }

  function choose(choice) {
    var grp = choice.closest('.choices');
    if (!grp || grp.classList.contains('locked')) return;
    Array.prototype.forEach.call(grp.querySelectorAll('.choice'), function (c) {
      c.classList.remove('sel-maru', 'sel-sankaku', 'sel-batsu');
    });
    choice.classList.add(choice.dataset.cls);
    picks[grp.dataset.id][grp.dataset.item] = choice.dataset.key;
  }

  function submit(id) {
    var ev = events.filter(function (x) { return x.id === id; })[0];
    if (!ev) return;
    var $msg = document.getElementById('msg-' + id);
    var $btn = document.querySelector('[data-send="' + id + '"]');
    var mine = picks[id] || {};

    var rest = ev.items.filter(function (it) { return !mine[it]; });
    if (rest.length) {
      $msg.className = 'card-msg ng';
      $msg.textContent = T('needAll', { list: rest.join(ATTEND.lang() === 'ja' ? '、' : ', ') });
      return;
    }

    $btn.disabled = true;
    $msg.className = 'card-msg';
    $msg.textContent = T('sending');

    ATTEND.post({ action: 'answer', deviceId: device, eventId: id, answers: mine })
      .then(function (res) {
        $msg.className = 'card-msg ok';
        $msg.textContent = T('sent');
        ev.mine = res.saved || mine;
        $btn.textContent = T('sendAgain');
        $btn.disabled = false;
        if (res.summary) paintSummary(id, res.summary);
      })
      .catch(function (err) {
        $msg.className = 'card-msg ng';
        $msg.textContent = String(err && err.message || err);
        $btn.disabled = false;
      });
  }

  function showSummary(id, btn) {
    var box = document.getElementById('sum-' + id);
    if (box.dataset.open === '1') {
      box.innerHTML = '';
      box.dataset.open = '';
      btn.textContent = T('showSummary');
      return;
    }
    box.innerHTML = ATTEND.loadingHtml(T('summarizing'));
    box.dataset.open = '1';
    btn.textContent = T('hideSummary');

    ATTEND.get('summary', { e: id })
      .then(function (res) { paintSummary(id, res.summary); })
      .catch(function (err) {
        box.innerHTML = ATTEND.noteHtml('', String(err && err.message || err), true);
      });
  }

  function paintSummary(id, sum) {
    var box = document.getElementById('sum-' + id);
    if (!box) return;
    box.innerHTML = ATTEND.summaryHtml(sum)
      + '<p class="unknown" style="padding:0 16px 14px">' + esc(T('sumNamesNote')) + '</p>';
    box.dataset.open = '1';
    var btn = document.querySelector('[data-sum="' + id + '"]');
    if (btn) btn.textContent = T('hideSummary');
  }
})();
</script>
</body>
</html>
