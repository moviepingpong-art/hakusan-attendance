<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title data-i18n-title="myTitle">わたしの回答</title>
<link rel="stylesheet" href="attend.css?v=20260824">
</head>
<body>

<header>
  <h1 data-i18n="myTitle">わたしの回答</h1>
  <p id="org"></p>
</header>
<div class="me" id="me"></div>

<div class="legend">
  <span class="lg-o"><b>〇</b> <span data-i18n="choiceYes">参加</span></span>
  <span class="lg-s"><b>△</b> <span data-i18n="choiceMaybe">どちらでも</span></span>
  <span class="lg-x"><b>×</b> <span data-i18n="choiceNo">不参加</span></span>
  <span class="lg-n"><b data-i18n="noAnswer">未回答</b> <span data-i18n="legendNone">まだ答えていない</span></span>
</div>
<div class="bar"><button class="refresh" id="refreshBtn" type="button" data-i18n="refresh">最新に更新</button></div>

<div class="wrap" id="wrap"></div>

<script src="attend.js?v=20260824"></script>
<script>
(function () {
  'use strict';

  var $wrap = document.getElementById('wrap');
  var $me   = document.getElementById('me');
  var $org  = document.getElementById('org');

  var esc = ATTEND.esc;
  var T = ATTEND.t;
  var device = ATTEND.deviceId();
  var formUrl = 'index.html?s=' + encodeURIComponent(ATTEND.orgId);

  $wrap.innerHTML = ATTEND.loadingHtml();
  if (ATTEND.requireOrgId($wrap)) return;

  document.getElementById('refreshBtn').addEventListener('click', function () { load(true); });

  // 回答フォームから戻ってきたら自動で最新化
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && window.__ready) load(true);
  });

  load(false);

  function load(isReload) {
    $wrap.innerHTML = ATTEND.loadingHtml(isReload ? T('refreshing') : T('loading'));

    ATTEND.get('myanswers', { d: device }).then(function (data) {
      window.__ready = true;
      if (data.org) {
        $org.textContent = data.org;
        ATTEND.setTitle('myTitle', data.org);
      }

      if (!data.registered) {
        $me.innerHTML = '<span>' + esc(T('notRegMe')) + '</span>';
        $wrap.innerHTML = ATTEND.noteHtml(T('notRegTitle'), T('notRegBody'))
          + '<a class="ghost" href="' + esc(formUrl) + '">' + esc(T('goForm')) + '</a>';
        return;
      }

      var my = T('meMy', { name: '\u0000' }).split('\u0000');
      $me.innerHTML = '<span>' + esc(my[0]) + '<b>' + esc(data.member.name) + '</b>' + esc(my[1] || '') + '</span>';
      render(data.myanswers || []);
    }).catch(function (err) {
      $wrap.innerHTML = ATTEND.noteHtml(T('failTitle'), String(err && err.message || err), true);
    });
  }

  function render(items) {
    if (!items.length) {
      $wrap.innerHTML = ATTEND.noteHtml(T('noOpenTitle'), T('noEventsBody'));
      return;
    }
    $wrap.innerHTML = items.map(cardHtml).join('');
  }

  function cardHtml(ev) {
    var pill = ev.allAnswered
      ? '<span class="status st-done">' + esc(T('pillDone')) + '</span>'
      : '<span class="status st-part">' + esc(T('pillPart')) + '</span>';

    var head = '<div class="card-head' + (ev.answered ? '' : ' no-border') + '">'
      + '<h2>' + esc(ev.name) + '</h2>'
      + ATTEND.metaHtml(ev)
      + (ev.answered ? '<div>' + pill + '</div>' : '')
      + '</div>';

    // 未回答は「未回答」とだけ大きく出す（フォームへ強制誘導しない）
    if (!ev.answered) {
      return '<div class="card">' + head
        + '<div class="unanswered">'
        +   '<div class="word">' + esc(T('noAnswer')) + '</div>'
        +   '<div class="sub">' + esc(T('unansweredSub')) + '</div>'
        + '</div>'
        + '</div>';
    }

    var rows = (ev.items || []).map(function (it) {
      var b = ATTEND.badge(it.answer);
      return '<div class="row"><div class="name">' + esc(it.name) + '</div>'
        + '<div class="ansbadge ' + b.cls + '">' + b.txt + '</div></div>';
    }).join('');

    return '<div class="card">' + head + rows
      + '<a class="ghost" href="' + esc(formUrl) + '&e=' + encodeURIComponent(ev.id) + '">' + esc(T('editAnswer')) + '</a>'
      + '</div>';
  }
})();
</script>
</body>
</html>
