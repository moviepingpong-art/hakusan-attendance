<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>わたしの回答</title>
</head>
<body>
<script>
/* 2026-08-25：配るURLを1本にまとめたので、このページは**転送だけ**になった。
   リッチメニューやブックマークに残っている古いリンクを、まとめた1本の該当タブへ送る。
   同じオリジンなので、端末の記憶（名前の選択）はそのまま引き継がれる。
   踏まれなくなったら消してよいが、消すと古いリンクが404になる。 */
(function () {
  'use strict';
  var p = new URLSearchParams(window.location.search);
  var s = String(p.get('s') || '').trim();
  var e = String(p.get('e') || '').trim();
  var q = s ? ('?s=' + encodeURIComponent(s) + (e ? '&e=' + encodeURIComponent(e) : '')) : '';
  // replace にする。戻るを押したときに、この転送ページへ戻らせない
  window.location.replace('./' + q + '#my');
})();
</script>
</body>
</html>
