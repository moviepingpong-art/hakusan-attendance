<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title data-i18n-title="statusTitle">出欠の状況</title>
<link rel="stylesheet" href="attend.css?v=20260827">
</head>
<body>

<header>
  <h1 data-i18n="statusTitle">出欠の状況</h1>
  <p id="org"></p>
</header>

<div class="bar"><button class="refresh" id="refreshBtn" type="button" data-i18n="refresh">最新に更新</button></div>
<div class="wrap" id="wrap"></div>
<p class="foot" data-i18n="footStatus">※ 人数のみ表示しています（どなたが回答したかは表示されません）。締切前は途中経過のため変わります。</p>

<script src="attend.js?v=20260827"></script>
<script src="attend-views.js?v=20260827"></script>
<script>
/* 中身は attend-views.js にある。まとめた1本（index.html）のタブと同じ実体を使う。
   ここに描画処理を書き戻さないこと。 */
(function () {
  'use strict';

  var $wrap = document.getElementById('wrap');
  $wrap.innerHTML = ATTEND.loadingHtml();
  if (ATTEND.requireOrgId($wrap)) return;

  var view = ATTEND.views.status.create({
    wrap: $wrap,
    org:  document.getElementById('org')
  });

  document.getElementById('refreshBtn').addEventListener('click', function () { view.load(true); });
  view.load(false);
})();
</script>
</body>
</html>
