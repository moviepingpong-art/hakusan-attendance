<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出欠状況｜白山ラージボール卓球クラブ</title>
<style>
  :root{
    --bg:#eef3f7; --card:#fff; --ink:#1d2733; --sub:#5a6b7b; --line:#d6e0ea;
    --brand:#1769b0; --brand-d:#0f4f88;
    --maru:#1a8f4c; --batsu:#c0392b; --sankaku:#b8860b;
    --male:#1769b0; --female:#c2407a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    font-size:16px;line-height:1.6;padding:0 0 40px;}
  header{background:var(--brand);color:#fff;padding:18px;position:sticky;top:0;z-index:5;}
  header h1{margin:0;font-size:19px;}
  header p{margin:4px 0 0;font-size:13px;opacity:.9;}
  .wrap{padding:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    margin:0 0 18px;overflow:hidden;box-shadow:0 1px 3px rgba(20,50,80,.06);}
  .card-head{padding:16px;border-bottom:1px solid var(--line);}
  .card-head h2{margin:0 0 6px;font-size:18px;line-height:1.4;}
  .meta{font-size:14px;color:var(--sub);margin:2px 0;}
  .badge{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:999px;
    font-size:13px;font-weight:700;}
  .badge.live{background:#e3f4ea;color:var(--maru);}
  .badge.closed{background:#eef0f3;color:var(--sub);}
  .resp{font-size:13px;color:var(--sub);margin-top:6px;}

  .event{padding:14px 16px;border-bottom:1px solid #eef2f6;}
  .event:last-child{border-bottom:none;}
  .event .name{font-weight:700;margin-bottom:10px;font-size:16px;}
  .row{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;margin:6px 0;}
  .row .lab{font-size:14px;font-weight:700;}
  .lab.maru{color:var(--maru);}
  .lab.sankaku{color:var(--sankaku);}
  .lab.batsu{color:var(--batsu);}
  .nums{display:flex;gap:8px;flex-wrap:wrap;}
  .pill{font-size:14px;padding:4px 10px;border-radius:8px;background:#f3f6f9;border:1px solid var(--line);}
  .pill .m{color:var(--male);font-weight:700;}
  .pill .f{color:var(--female);font-weight:700;}
  .pill .total{font-weight:700;}
  .unknown{font-size:12px;color:var(--sub);margin-top:4px;}

  .state{padding:48px 24px;text-align:center;color:var(--sub);}
  .state.err{color:var(--batsu);}
  .spinner{width:34px;height:34px;margin:0 auto 14px;border:4px solid var(--line);
    border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none;}}
  .note{font-size:12px;color:var(--sub);text-align:center;margin-top:8px;}
</style>
</head>
<body>
<header>
  <h1>大会の出欠状況</h1>
  <p>白山ラージボール卓球クラブ</p>
</header>
<div class="wrap" id="wrap">
  <div class="state"><div class="spinner"></div>読み込んでいます…</div>
</div>

<script>
/* ===== ここだけ設定 ===== */
const GAS_URL = "https://script.google.com/macros/s/AKfycbwmS3DUX7BBmT2Vh7U3OkNWdD4Z5IWgLHOMIuqmkSfvMDrk7UBZNewfLsHCzFvq6-hv/exec";   // ← 出欠フォームと同じ裏方GASのURL
/* ======================== */

main();
async function main(){
  try{
    const res = await fetch(GAS_URL + "?action=summary");
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "取得エラー");
    render(data.summary || []);
  }catch(err){
    document.getElementById("wrap").innerHTML =
      `<div class="state err">読み込みに失敗しました。<br><small>${esc(String(err))}</small></div>`;
  }
}

function render(list){
  const wrap = document.getElementById("wrap");
  if(!list.length){ wrap.innerHTML = `<div class="state">表示できる出欠データがありません。</div>`; return; }
  wrap.innerHTML = "";

  list.forEach(t=>{
    const card = document.createElement("div");
    card.className = "card";
    const badge = t.closed
      ? `<span class="badge closed">締切後 ・ 最終結果</span>`
      : `<span class="badge live">締切前 ・ 途中経過</span>`;

    let html = `<div class="card-head">
        <h2>${esc(t.taikaimei)}</h2>
        ${t.kaisaibi  ? `<div class="meta">📅 開催：${esc(t.kaisaibi)}</div>`:""}
        ${t.shimekiri ? `<div class="meta">⏰ 締切：${esc(t.shimekiri)}</div>`:""}
        ${badge}
        <div class="resp">回答済み：${t.respCount}人</div>
      </div>`;

    t.shumoku.forEach(s=>{
      html += `<div class="event"><div class="name">${esc(s.name)}</div>
        ${line("maru","〇 参加", s.maru)}
        ${line("sankaku","△ どちらでも", s.sankaku)}
        ${line("batsu","× 不参加", s.batsu)}
        ${unknownNote(s)}
      </div>`;
    });
    card.innerHTML = html;
    wrap.appendChild(card);
  });

  const note = document.createElement("p");
  note.className = "note";
  note.textContent = "※ 人数のみ表示しています（個人名は表示されません）。締切前は途中経過のため変動します。";
  wrap.appendChild(note);
}

function line(cls, label, o){
  const total = (o.m||0)+(o.f||0)+(o.u||0);
  return `<div class="row">
      <span class="lab ${cls}">${label}</span>
      <div class="nums">
        <span class="pill"><span class="total">計 ${total}</span></span>
        <span class="pill">男 <span class="m">${o.m||0}</span></span>
        <span class="pill">女 <span class="f">${o.f||0}</span></span>
      </div>
    </div>`;
}
function unknownNote(s){
  const u = (s.maru.u||0)+(s.sankaku.u||0)+(s.batsu.u||0);
  return u>0 ? `<div class="unknown">※ 性別未登録の回答 ${u}件を含みます（男女の内訳に未反映）</div>` : "";
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
</script>
</body>
</html>
