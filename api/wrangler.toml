# 出欠システム API — Cloudflare Worker の設定
#
# 初回の手順は README.md を見ること。
#
# database_id には**本番の値がすでに入っている**。ふだんは触らなくてよい。
# 別のCloudflareアカウントで動かすときだけ、`wrangler d1 create dropper-attendance`
# が出力した値に書き換える。

name = "dropper-attendance-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# 本番の入口。dropper-tools.com は Cloudflare で取得ずみなので、
# api.dropper-tools.com をそのまま生やせる。
routes = [
  { pattern = "api.dropper-tools.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "dropper-attendance"
database_id = "633b3955-06e5-472d-a924-91b643d4a424"

# 観測。無料枠の上限に近づいたことに気づけるようにしておく
[observability]
enabled = true

# 回数の上限。**鍵が無くても呼べる書き込み口**だけに掛ける（送り手の IP ごとに数える）。
# 迷惑な連打を止めるためのもので、正確な数ではない（Cloudflare の場所ごとに数える）。
# period に使えるのは 10 か 60（秒）だけ。namespace_id はアカウントの中で重ならない数字にする。
# 手元で動かすときに設定が無ければ、コードは数えずに通す。

# createOrg（団体を作る）
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# register・answer（参加者の書き込み）
[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60
